name: Build AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twa-project

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore signing key from secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks

      # 비밀번호는 2026-08-26부터 build.gradle 에 안 적혀 있다(저장소가 Public).
      # keystore.properties 는 .gitignore 라 CI 에는 없으므로 Secrets 로 여기서 만든다.
      # ⚠️ 아래 두 Secret 이 비어 있으면 build.gradle 이 명확한 메시지와 함께 빌드를 멈춘다.
      - name: Create keystore.properties from secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD 가 비어 있습니다. GitHub → Settings → Secrets 에 등록하세요."
            exit 1
          fi
          cat > keystore.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=abc-frog
          EOF
          echo "keystore.properties 생성됨 (내용은 출력하지 않음)"

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1
        env:
          GRADLE_VERSION: 8.11.1

      - name: Build AAB
        run: ./gradlew bundleRelease --no-daemon

      - name: List outputs
        if: always()
        run: find . -name "*.aab" -o -name "*.apk" 2>/dev/null | head -20

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: abc-frog-aab
          path: twa-project/app/build/outputs/bundle/release/*.aab
