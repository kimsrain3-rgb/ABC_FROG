<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ABC Frog - Phonics Proto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overscroll-behavior:none;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Fredoka','Comic Sans MS','Chalkboard SE',cursive}
  #stage{position:relative;width:100%;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}

  /* 위쪽: 단어 보드 */
  #board{position:relative;flex:0 0 58%;background:linear-gradient(180deg,#eef6e8,#e0ecd9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh}
  #videoBox{display:none;position:relative;overflow:hidden;width:70%;aspect-ratio:16/10;background:#9e9e9e;border-radius:14px;align-items:center;justify-content:center;color:#e0e0e0;font-size:5vw;box-shadow:inset 0 0 0 3px #8a8a8a}
  #videoBox video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;border-radius:14px}
  #slots{display:flex;gap:3vw}
  .slot{position:relative;width:19vw;height:19vw;max-width:104px;max-height:104px;border:4px dashed #b8c9ae;border-radius:16px;background:rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center}
  .slot .ghost{font-size:12vw;font-weight:700;color:#c5d4bb;line-height:1}
  .slot.filled{border-style:solid;border-color:#F57F17;background:#fffde7}
  .slot.filled .ghost{color:#F57F17}
  .slot.pulse{animation:pulse .45s ease}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  #bigWord{display:none;align-items:center;justify-content:center;pointer-events:none}
  #bigWord span{display:inline-block;font-weight:700;color:#FFEB3B;text-shadow:3px 3px 0 #F57F17,5px 5px 0 rgba(0,0,0,.25),0 0 2px #B25800;line-height:1;transform:scale(0);animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes pop{to{transform:scale(1)}}

  /* 아래쪽: 글자 조각 트레이 */
  #tray{position:relative;flex:1;background:linear-gradient(180deg,#cde6c3,#a8d19a)}
  .tile{position:absolute;width:17vw;height:17vw;max-width:92px;max-height:92px;border-radius:16px;background:#fff;box-shadow:0 4px 0 #b0b0b0,0 6px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:11vw;font-weight:700;color:#33691E;cursor:grab;touch-action:none;transition:transform .15s}
  .tile.drag{z-index:60;box-shadow:0 10px 18px rgba(0,0,0,.35);transform:scale(1.15);transition:none;cursor:grabbing}
  .tile.back{transition:left .35s cubic-bezier(.22,1,.36,1),top .35s cubic-bezier(.22,1,.36,1),transform .2s}
  .tile.placed{transition:left .18s ease-out,top .18s ease-out,opacity .15s;pointer-events:none}

  #replay{display:none;position:absolute;bottom:3vh;left:50%;transform:translateX(-50%);z-index:70;border:4px solid #fff;border-radius:40px;padding:10px 26px;font-family:inherit;font-weight:700;font-size:6vw;color:#fff;background:linear-gradient(180deg,#81C784,#4CAF50);box-shadow:0 5px 0 #388E3C,0 7px 14px rgba(0,0,0,.3);cursor:pointer}
  #tag{position:absolute;top:6px;left:10px;z-index:50;font-size:12px;color:#7a8a70;opacity:.7}
</style>
</head>
<body>
<div id="stage">
  <div id="tag">phonics proto · satpin 1</div>
  <div id="board">
    <div id="videoBox">&#127916; 영상 자리</div>
    <div id="slots"></div>
    <div id="bigWord"><span></span></div>
  </div>
  <div id="tray"></div>
  <button id="replay">다시 하기</button>
</div>
<script>
'use strict';
window.onerror=function(){return true};

/* ── 데이터: 단어 추가는 여기에만 ─────────────────────────── */
var WORDS=[
  {word:'sat', traps:['p','i','n'], video:'word_sat.mp4'} // 영상: assets/phonics/videos/ 안 파일명
];
var CUR=0;

/* ── 소리: assets/phonics/sounds/ 에 파일 있으면 재생, 없으면 임시 삑소리 ──
   글자 음가 = phoneme_s.mp3 ~ phoneme_n.mp3 / 단어 통발음 = word_sat.mp3 */
var SND_BASE='../../assets/phonics/sounds/';
/* ── 영상: assets/phonics/videos/word_sat.mp4 있으면 재생, 없으면 회색 박스 ── */
var VID_BASE='../../assets/phonics/videos/';
var SILENT=/[?&]silent=1/.test(location.search);
var FREQ={s:523,a:587,t:659,p:784,i:880,n:698}; // 글자별 임시 음높이(도레미솔라파)
var ax=null;
function ea(){ if(ax) return ax;
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC) ax=new AC(); }catch(e){}
  return ax; }
function beep(freq,dur){ if(SILENT) return;
  try{ var c=ea(); if(!c) return;
    var o=c.createOscillator(),g=c.createGain();
    o.type='sine'; o.frequency.value=freq||440;
    g.gain.setValueAtTime(0.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.4,c.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+(dur||0.22));
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+(dur||0.22)+0.05);
  }catch(e){} }
var sndCache={};
function sound(key,freq){ // key='s' → s.mp3 시도, 실패 시 삑소리
  if(!sndCache[key]){
    var a=null,bad=false;
    try{ a=new Audio(SND_BASE+key+'.mp3'); a.preload='auto';
      a.addEventListener('error',function(){bad=true;},{once:true});
    }catch(e){ bad=true; }
    sndCache[key]={play:function(){ if(SILENT) return;
      if(a&&!bad){ try{ a.currentTime=0; var p=a.play(); if(p&&p.catch) p.catch(function(){beep(freq);}); return; }catch(e){} }
      beep(freq); }};
  }
  return sndCache[key]; }
function letterSound(ch){ sound('phoneme_'+ch,FREQ[ch]||440).play(); }

/* ── 판 만들기 ───────────────────────────────────────────── */
var slotsEl=document.getElementById('slots'),trayEl=document.getElementById('tray'),
    stage=document.getElementById('stage'),bigWord=document.getElementById('bigWord'),
    videoBox=document.getElementById('videoBox'),replayBtn=document.getElementById('replay');
var slots=[],tiles=[],locked=false;

/* 트레이 안 흩어진 위치(비율) — 6칸 고정 자리, 순서만 섞음 */
var SPOTS=[[.10,.12],[.44,.06],[.76,.14],[.14,.52],[.46,.48],[.74,.55]];

function shuffle(arr){ for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=arr[i];arr[i]=arr[j];arr[j]=t; } return arr; }

function build(){
  var W=WORDS[CUR]; locked=false;
  slotsEl.innerHTML=''; slotsEl.style.display='flex'; trayEl.innerHTML='';
  bigWord.style.display='none'; replayBtn.style.display='none';
  videoBox.style.display='none'; videoBox.innerHTML='&#127916; 영상 자리'; // 다시 하기 시 영상 제거·복원
  slots=[]; tiles=[];
  W.word.split('').forEach(function(ch){
    var s=document.createElement('div'); s.className='slot';
    s.innerHTML='<span class="ghost">'+ch+'</span>';
    slotsEl.appendChild(s);
    slots.push({el:s,letter:ch,filled:false});
  });
  var letters=shuffle(W.word.split('').concat(W.traps));
  var spots=shuffle(SPOTS.slice());
  letters.forEach(function(ch,i){
    var t=document.createElement('div'); t.className='tile'; t.textContent=ch;
    trayEl.appendChild(t);
    var tile={el:t,letter:ch,home:spots[i],placed:false};
    tiles.push(tile);
    place(tile);
    attachDrag(tile);
  });
}
function place(tile){ // home 비율 → px
  var r=trayEl.getBoundingClientRect(),tw=tile.el.offsetWidth;
  tile.el.style.left=(r.width*tile.home[0])+'px';
  tile.el.style.top =(r.height*tile.home[1])+'px';
  void tw;
}
window.addEventListener('resize',function(){ tiles.forEach(function(t){ if(!t.placed) place(t); }); });

/* ── 드래그 ─────────────────────────────────────────────── */
function attachDrag(tile){
  var el=tile.el,sx=0,sy=0,ox=0,oy=0,moved=false;
  el.addEventListener('pointerdown',function(e){
    if(locked||tile.placed) return;
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    letterSound(tile.letter);                    // 터치 순간 글자 소리
    el.classList.add('drag'); el.classList.remove('back');
    sx=e.clientX; sy=e.clientY;
    ox=parseFloat(el.style.left)||0; oy=parseFloat(el.style.top)||0;
    moved=true;
    function mv(ev){ if(!moved) return;
      el.style.left=(ox+ev.clientX-sx)+'px';
      el.style.top =(oy+ev.clientY-sy)+'px'; }
    function up(ev){ moved=false;
      el.removeEventListener('pointermove',mv);
      el.removeEventListener('pointerup',up);
      el.removeEventListener('pointercancel',up);
      el.classList.remove('drag');
      drop(tile); }
    el.addEventListener('pointermove',mv);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up);
  });
}
function drop(tile){
  var tr=tile.el.getBoundingClientRect(),
      cx=tr.left+tr.width/2, cy=tr.top+tr.height/2, hit=null;
  slots.forEach(function(s){
    if(s.filled) return;
    var r=s.el.getBoundingClientRect(),pad=r.width*0.35;
    if(cx>r.left-pad&&cx<r.right+pad&&cy>r.top-pad&&cy<r.bottom+pad) hit=s;
  });
  if(hit&&hit.letter===tile.letter){            // 정답: 착 붙기
    var sr=hit.el.getBoundingClientRect(),pr=trayEl.getBoundingClientRect();
    tile.el.classList.add('placed');
    tile.el.style.left=(sr.left-pr.left+(sr.width-tile.el.offsetWidth)/2)+'px';
    tile.el.style.top =(sr.top -pr.top +(sr.height-tile.el.offsetHeight)/2)+'px';
    hit.filled=true; tile.placed=true;
    beep(1046,0.12);                            // 착! 효과음(임시)
    setTimeout(function(){                      // 조각을 빈칸 안으로 흡수(레이아웃 밀려도 같이 움직이게)
      hit.el.classList.add('filled','pulse');
      tile.el.style.display='none';
      setTimeout(function(){ hit.el.classList.remove('pulse'); },500);
    },200);
    if(slots.every(function(s){return s.filled;})) setTimeout(finish,650);
  }else{                                        // 오답/빈 곳: 제자리로
    if(hit) beep(196,0.25);
    tile.el.classList.add('back');
    place(tile);
  }
}

/* ── 완성 연출: ①음가 순서대로(스…애…트) → ②잠깐 쉬고 → ③단어 통발음 + 크게 표시 ── */
function finish(){
  locked=true;
  var W=WORDS[CUR],i=0;
  function next(){                              // ① 음가 순차 재생 (빈칸 하나씩 통통)
    if(i<W.word.length){
      var ch=W.word[i],s=slots[i];
      s.el.classList.add('pulse'); (function(el){setTimeout(function(){el.classList.remove('pulse');},500);})(s.el);
      letterSound(ch); i++;
      setTimeout(next,550);
    }else{
      setTimeout(showWord,750);                 // ② 잠깐 쉬기
    }
  }
  function showWord(){                          // ③ 단어 통발음(word_sat.mp3, 없으면 임시 연결음) + 크게 표시
    if(!SILENT){
      var a=null,bad=false;
      try{ a=new Audio(SND_BASE+'word_'+W.word+'.mp3');
        a.addEventListener('error',function(){bad=true;arp();},{once:true});
        var p=a.play(); if(p&&p.catch) p.catch(function(){ if(!bad){bad=true;arp();} });
      }catch(e){ arp(); }
    }
    function arp(){ W.word.split('').forEach(function(ch,k){ setTimeout(function(){beep(FREQ[ch]||440,0.18);},k*160); }); }
    slotsEl.style.display='none';               // 빈칸 대신 완성 화면으로 전환
    videoBox.style.display='flex';              // 영상 파일 있으면 재생, 없으면 회색 박스 유지
    if(W.video){
      try{
        var v=document.createElement('video');
        v.src=VID_BASE+W.video; v.autoplay=true; v.playsInline=true; v.setAttribute('playsinline','');
        v.addEventListener('loadeddata',function(){
          videoBox.textContent=''; videoBox.appendChild(v);
          var p=v.play(); if(p&&p.catch) p.catch(function(){ v.muted=true; var q=v.play(); if(q&&q.catch)q.catch(function(){}); });
        },{once:true});
        // 파일 없으면 error → 아무것도 안 함(회색 박스 그대로)
      }catch(e){}
    }
    var sp=bigWord.querySelector('span');
    sp.textContent=W.word;
    bigWord.style.display='flex';
    fitWord(sp);
    replayBtn.style.display='block';
  }
  next();
}
/* 실측 글자 맞춤(fitWord 패턴): 공식 대신 실제 폭을 재서 줄임 */
function fitWord(sp){
  sp.style.fontSize='30vw';
  var max=stage.getBoundingClientRect().width*0.86;
  for(var g=0;g<12&&sp.offsetWidth>max;g++){ // offsetWidth: 팝 애니메이션(scale) 영향 없는 실측 폭
    sp.style.fontSize=(parseFloat(getComputedStyle(sp).fontSize)*0.92)+'px';
  }
}
replayBtn.addEventListener('click',build);
build();
</script>
</body>
</html>
