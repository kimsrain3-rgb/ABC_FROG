<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ABC Frog - Phonics Proto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overscroll-behavior:none;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Fredoka','Comic Sans MS','Chalkboard SE',cursive}
  #stage{position:relative;width:100%;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}

  /* 위쪽: 단어 보드 */
  #board{position:relative;flex:0 0 58%;background:linear-gradient(180deg,#eef6e8,#e0ecd9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh}
  /* 영상: 위쪽 board 영역을 꽉 채움 (세로 9:16 영상) */
  #videoBox{display:none;position:absolute;inset:0;z-index:5;overflow:hidden;background:#9e9e9e;align-items:center;justify-content:center;color:#e0e0e0;font-size:6vw}
  #videoBox video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
  #slots{display:flex;gap:3vw}
  .slot{position:relative;width:19vw;height:19vw;max-width:104px;max-height:104px;border:4px dashed #b8c9ae;border-radius:16px;background:rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center}
  .slot .ghost{font-size:12vw;font-weight:700;color:#c5d4bb;line-height:1}
  .slot.filled{border-style:solid;border-color:#F57F17;background:#fffde7}
  .slot.filled .ghost{color:#F57F17}
  .slot.pulse{animation:pulse .45s ease}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  /* 완성 단어: 아래쪽(조각 있던 빈 자리, board 아래 42%) 가운데. tray 밖(stage 직속)이라 리셋에도 안 지워짐 */
  #bigWord{display:none;position:absolute;left:0;right:0;top:58%;bottom:0;z-index:5;align-items:center;justify-content:center;pointer-events:none}
  #bigWord span{display:inline-block;font-weight:700;color:#FFEB3B;text-shadow:3px 3px 0 #F57F17,5px 5px 0 rgba(0,0,0,.25),0 0 2px #B25800;line-height:1;transform:scale(0);animation:wordpop 1.5s ease forwards}
  /* 등장(팝) 후 두 번 반짝임 — 앉는 순간 단어 발음과 함께 */
  @keyframes wordpop{0%{transform:scale(0);opacity:0}22%{transform:scale(1.12);opacity:1}32%{transform:scale(1)}48%{opacity:.25}60%{opacity:1}74%{opacity:.25}86%{opacity:1}100%{transform:scale(1);opacity:1}}

  /* 아래쪽: 글자 조각 트레이 */
  #tray{position:relative;flex:1;background:linear-gradient(180deg,#cde6c3,#a8d19a)}
  /* 바닥 글자: 완성화면 노란 통통 글씨(#bigWord span, 27줄)와 동일한 색·3중 그림자. 흰 박스/테두리/그림자 없음. 히트영역(w/h 17vw)은 유지 */
  .tile{position:absolute;width:17vw;height:17vw;max-width:92px;max-height:92px;display:flex;align-items:center;justify-content:center;font-size:15vw;font-weight:700;color:#FFEB3B;text-shadow:3px 3px 0 #F57F17,5px 5px 0 rgba(0,0,0,.25),0 0 2px #B25800;line-height:1;cursor:grab;touch-action:none;transition:transform .15s}
  .tile.drag{z-index:60;transform:scale(1.15);transition:none;cursor:grabbing}
  .tile.back{transition:left .35s cubic-bezier(.22,1,.36,1),top .35s cubic-bezier(.22,1,.36,1),transform .2s}
  .tile.placed{transition:left .18s ease-out,top .18s ease-out,opacity .15s;pointer-events:none}

  /* 드래그 안내 손가락: 첫 글자 위에서 첫 빈칸 쪽으로 왔다갔다. 실제로 끌기 시작하면 JS가 숨김 */
  #hand{display:none;position:absolute;z-index:65;font-size:13vw;line-height:1;margin-left:-.5em;margin-top:-.12em;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transform:translate(0,0);animation:handmove 1.5s ease-in-out infinite;will-change:transform}
  @keyframes handmove{0%{transform:translate(0,0) scale(1)}12%{transform:translate(0,0) scale(1.14)}55%{transform:translate(var(--hdx,0),var(--hdy,0)) scale(1)}100%{transform:translate(0,0) scale(1)}}

  #replay{display:none;position:absolute;bottom:3vh;left:50%;transform:translateX(-50%);z-index:70;border:4px solid #fff;border-radius:40px;padding:10px 26px;font-family:inherit;font-weight:700;font-size:6vw;color:#fff;background:linear-gradient(180deg,#81C784,#4CAF50);box-shadow:0 5px 0 #388E3C,0 7px 14px rgba(0,0,0,.3);cursor:pointer}
  #tag{position:absolute;top:6px;left:10px;z-index:50;font-size:12px;color:#7a8a70;opacity:.7}
</style>
</head>
<body>
<div id="stage">
  <div id="tag">phonics proto · satpin 1</div>
  <div id="board">
    <div id="videoBox">&#127916; 영상 자리</div>
    <div id="slots"></div>
  </div>
  <div id="tray"></div>
  <div id="bigWord"><span></span></div>
  <div id="hand">&#128070;</div>
  <button id="replay">다시 하기</button>
</div>
<script>
'use strict';
window.onerror=function(){return true};

/* ── 데이터: 단어 추가는 여기에만 ─────────────────────────── */
var WORDS=[
  // videos: 완성 영상 후보(동물별) — 파일명 = 단어_동물.mp4 (예: sat_dog.mp4), 있는 것 중 랜덤 재생
  {word:'sat', traps:[], videos:['dog','cat','raccoon']}
];
var CUR=0;

/* ── 소리: assets/phonics/sounds/ 에 파일 있으면 재생, 없으면 임시 삑소리 ──
   글자 음가 = phoneme_s.mp3 ~ phoneme_n.mp3 / 단어 통발음 = word_sat.mp3 */
var SND_BASE='../../assets/phonics/sounds/';       // 음가(phoneme_*)·단어(word_*)
var ABC_BASE='../../assets/abc/sounds/';           // 글자 이름(letter_*) — 알파벳 게임 소리 재활용
/* ── 영상: assets/phonics/videos/word_sat.mp4 있으면 재생, 없으면 회색 박스 ── */
var VID_BASE='../../assets/phonics/videos/';
var SILENT=/[?&]silent=1/.test(location.search);
var FREQ={s:523,a:587,t:659,p:784,i:880,n:698}; // 글자별 임시 음높이(도레미솔라파)
var ax=null;
function ea(){ if(ax) return ax;
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC) ax=new AC(); }catch(e){}
  return ax; }
function beep(freq,dur){ if(SILENT) return;
  try{ var c=ea(); if(!c) return;
    var o=c.createOscillator(),g=c.createGain();
    o.type='sine'; o.frequency.value=freq||440;
    g.gain.setValueAtTime(0.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.4,c.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+(dur||0.22));
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+(dur||0.22)+0.05);
  }catch(e){} }
var sndCache={};
function loadSound(base,key,freq){ // base+key+'.mp3' 있으면 재생, 없으면 삑소리
  var id=base+key;
  if(!sndCache[id]){
    var a=null,bad=false;
    try{ a=new Audio(base+key+'.mp3'); a.preload='auto';
      a.addEventListener('error',function(){bad=true;},{once:true});
    }catch(e){ bad=true; }
    sndCache[id]={play:function(){ if(SILENT) return;
      if(a&&!bad){ try{ a.currentTime=0; var p=a.play(); if(p&&p.catch) p.catch(function(){beep(freq);}); return; }catch(e){} }
      beep(freq); }};
  }
  return sndCache[id]; }
function letterName(ch){ loadSound(ABC_BASE,'letter_'+ch,FREQ[ch]||440).play(); }    // 스테이지1: 글자 이름("에스")
function phonemeSound(ch){ loadSound(SND_BASE,'phoneme_'+ch,FREQ[ch]||440).play(); }  // 스테이지2: 음가("스")

/* ── 판 만들기 ───────────────────────────────────────────── */
var slotsEl=document.getElementById('slots'),trayEl=document.getElementById('tray'),
    stage=document.getElementById('stage'),bigWord=document.getElementById('bigWord'),
    videoBox=document.getElementById('videoBox'),replayBtn=document.getElementById('replay'),
    hand=document.getElementById('hand');
var slots=[],tiles=[],locked=false;

/* 트레이 안 흩어진 위치(비율) — 6칸 고정 자리, 순서만 섞음 */
var SPOTS=[[.10,.12],[.44,.06],[.76,.14],[.14,.52],[.46,.48],[.74,.55]];

function shuffle(arr){ for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=arr[i];arr[i]=arr[j];arr[j]=t; } return arr; }

function build(){
  var W=WORDS[CUR]; locked=false;
  slotsEl.innerHTML=''; slotsEl.style.display='flex'; trayEl.innerHTML='';
  bigWord.style.display='none'; replayBtn.style.display='none';
  videoBox.style.display='none'; videoBox.innerHTML='&#127916; 영상 자리'; // 다시 하기 시 영상 제거·복원
  slots=[]; tiles=[];
  W.word.split('').forEach(function(ch){
    var s=document.createElement('div'); s.className='slot';
    s.innerHTML='<span class="ghost">'+ch+'</span>';
    slotsEl.appendChild(s);
    slots.push({el:s,letter:ch,filled:false});
  });
  var letters=shuffle(W.word.split('').concat(W.traps));
  var spots=shuffle(SPOTS.slice());
  letters.forEach(function(ch,i){
    var t=document.createElement('div'); t.className='tile'; t.textContent=ch;
    trayEl.appendChild(t);
    var tile={el:t,letter:ch,home:spots[i],placed:false};
    tiles.push(tile);
    place(tile);
    attachDrag(tile);
  });
  showHand();                                   // 첫 글자 위에 드래그 안내 손가락 표시
}
/* 드래그 안내 손가락: 첫 글자(=슬롯0 글자) 조각 위 → 첫 빈칸 쪽으로 왔다갔다. 실제 드래그 시작 시 hideHand */
function showHand(){
  if(!hand) return; hideHand();
  if(!slots.length||!tiles.length) return;
  var target=null;
  for(var i=0;i<tiles.length;i++){ if(tiles[i].letter===slots[0].letter){ target=tiles[i]; break; } }
  if(!target) return;
  var st=stage.getBoundingClientRect(),
      tr=target.el.getBoundingClientRect(),
      sr=slots[0].el.getBoundingClientRect();
  var tcx=tr.left-st.left+tr.width/2, tcy=tr.top-st.top+tr.height/2;   // 첫 글자 중심
  var scx=sr.left-st.left+sr.width/2, scy=sr.top-st.top+sr.height/2;   // 첫 빈칸 중심
  hand.style.left=tcx+'px'; hand.style.top=tcy+'px';
  hand.style.setProperty('--hdx',(scx-tcx)+'px');
  hand.style.setProperty('--hdy',(scy-tcy)+'px');
  hand.style.display='block';
}
function hideHand(){ if(hand) hand.style.display='none'; }
function place(tile){ // home 비율 → px
  var r=trayEl.getBoundingClientRect(),tw=tile.el.offsetWidth;
  tile.el.style.left=(r.width*tile.home[0])+'px';
  tile.el.style.top =(r.height*tile.home[1])+'px';
  void tw;
}
window.addEventListener('resize',function(){ tiles.forEach(function(t){ if(!t.placed) place(t); }); });

/* ── 드래그 ─────────────────────────────────────────────── */
function attachDrag(tile){
  var el=tile.el,sx=0,sy=0,ox=0,oy=0,moved=false;
  el.addEventListener('pointerdown',function(e){
    if(locked||tile.placed) return;
    hideHand();                                 // 아이가 실제로 끌기 시작하면 안내 손가락 사라짐
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    el.classList.add('drag'); el.classList.remove('back');
    sx=e.clientX; sy=e.clientY;
    ox=parseFloat(el.style.left)||0; oy=parseFloat(el.style.top)||0;
    moved=true;
    function mv(ev){ if(!moved) return;
      el.style.left=(ox+ev.clientX-sx)+'px';
      el.style.top =(oy+ev.clientY-sy)+'px'; }
    function up(ev){ moved=false;
      el.removeEventListener('pointermove',mv);
      el.removeEventListener('pointerup',up);
      el.removeEventListener('pointercancel',up);
      el.classList.remove('drag');
      drop(tile); }
    el.addEventListener('pointermove',mv);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up);
  });
}
function drop(tile){
  var tr=tile.el.getBoundingClientRect(),
      cx=tr.left+tr.width/2, cy=tr.top+tr.height/2, hit=null;
  slots.forEach(function(s){
    if(s.filled) return;
    var r=s.el.getBoundingClientRect(),pad=r.width*0.35;
    if(cx>r.left-pad&&cx<r.right+pad&&cy>r.top-pad&&cy<r.bottom+pad) hit=s;
  });
  if(hit&&hit.letter===tile.letter){            // 정답: 착 붙기
    var sr=hit.el.getBoundingClientRect(),pr=trayEl.getBoundingClientRect();
    tile.el.classList.add('placed');
    tile.el.style.left=(sr.left-pr.left+(sr.width-tile.el.offsetWidth)/2)+'px';
    tile.el.style.top =(sr.top -pr.top +(sr.height-tile.el.offsetHeight)/2)+'px';
    hit.filled=true; tile.placed=true;
    letterName(tile.letter);                    // 스테이지1: 칸에 넣는 순간 글자 이름("에스")
    setTimeout(function(){                      // 조각을 빈칸 안으로 흡수(레이아웃 밀려도 같이 움직이게)
      hit.el.classList.add('filled','pulse');
      tile.el.style.display='none';
      setTimeout(function(){ hit.el.classList.remove('pulse'); },500);
    },200);
    if(slots.every(function(s){return s.filled;})) setTimeout(finish,2000); // 글자이름 끝나고 음가 시작까지 약 2초 쉼
  }else{                                        // 오답/빈 곳: 제자리로
    if(hit) beep(196,0.25);
    tile.el.classList.add('back');
    place(tile);
  }
}

/* ── 완성 연출: ②반짝임+음가(스…애…트) → 잠깐 쉬고 → ③단어 통발음("샛!") + 크게 표시 ── */
function finish(){
  locked=true;
  var W=WORDS[CUR],i=0;
  tiles.forEach(function(t){ if(!t.placed){ // 남은 함정 글자 사라지게(아래 자리 비움 → sat 들어갈 자리)
    t.el.style.transition='opacity .3s'; t.el.style.opacity='0';
    setTimeout(function(){ t.el.style.display='none'; },300);
  }});
  function next(){                              // ② 반짝임 + 음가 동기화 (빈칸 하나씩)
    if(i<W.word.length){
      var ch=W.word[i],s=slots[i];
      s.el.classList.add('pulse'); (function(el){setTimeout(function(){el.classList.remove('pulse');},500);})(s.el);
      phonemeSound(ch); i++;                     // 반짝이는 글자의 음가("스"·"애"·"트")
      setTimeout(next,850);                       // 음가 사이 간격(여유있게)
    }else{
      setTimeout(showWord,750);                 // ② 잠깐 쉬기
    }
  }
  function showWord(){                          // ③ 완성 후: sat 반짝+발음 → 영상(걷다가 앉기) → 앉는 순간 sat 반짝+발음
    slotsEl.style.display='none';               // 빈칸 대신 완성 화면으로 전환
    videoBox.style.display='flex';              // 위쪽: 영상 영역(회색 → 곧 영상)
    var sp=bigWord.querySelector('span'); sp.textContent=W.word;
    // ③-1 영상 들어가기 전: 아래쪽 sat 반짝 + 발음 한 번
    showBigWord(sp); sayWord();
    // ③-2 잠깐 뒤 위쪽에서 영상 재생 (강아지→고양이→너구리 차례로, sat은 아래 그대로 유지)
    setTimeout(function(){ playVideo(W, onSit, onAllDone); },1600);
    function onSit(){                            // ③-3 각 동물 앉는 순간: sat 다시 반짝 + 발음 (세 번 반복)
      showBigWord(sp); sayWord();
    }
    function onAllDone(){                        // 세 동물 다 앉으면 다시 하기 버튼
      replayBtn.style.display='block';
    }
  }
  function showBigWord(sp){                      // 큰 단어 표시 + 반짝임(wordpop) 재시작 — 애니메이션 걸린 span 기준 리셋
    bigWord.style.display='flex';
    sp.style.animation='none'; void sp.offsetWidth; sp.style.animation=''; // span 리플로우로 애니메이션 재시작
    fitWord(sp);
  }
  function sayWord(){                            // 단어 통발음(word_sat.mp3, 없으면 임시 연결음)
    if(SILENT) return;
    var arped=false;
    function arp(){ if(arped) return; arped=true; W.word.split('').forEach(function(ch,k){ setTimeout(function(){beep(FREQ[ch]||440,0.18);},k*160); }); }
    try{ var a=new Audio(SND_BASE+'word_'+W.word+'.mp3');
      a.addEventListener('error',function(){ arp(); },{once:true});
      var p=a.play(); if(p&&p.catch) p.catch(function(){ arp(); });
    }catch(e){ arp(); }
  }
  next();
}
/* 완성 영상: 동물 영상을 정해진 순서(강아지→고양이→너구리)로 차례차례 재생.
   각 영상이 끝날 때(동물이 앉는 순간)마다 onSit, 마지막 영상까지 끝나면 onAllDone.
   없는 영상은 앉음 취급 없이 건너뜀. 전부 없으면 바로 onAllDone */
function playVideo(W, onSit, onAllDone){
  var list=W.videos||[];
  if(!list.length){ if(onAllDone)onAllDone(); return; }
  var GAP=1600;                                  // 앉은 뒤 sat 발음 들려주고 다음 동물 입장까지 쉼
  (function playAt(k){
    if(k>=list.length){ if(onAllDone)onAllDone(); return; } // 마지막까지 끝 → 종료
    var isLast=(k===list.length-1),done=false;
    try{
      var v=document.createElement('video');
      v.src=VID_BASE+W.word+'_'+list[k]+'.mp4';   // 예: sat_dog.mp4
      v.autoplay=true; v.playsInline=true; v.muted=true; // 무음 재생(게임 소리는 mp3로 별도) → 모바일 자동재생 보장
      v.setAttribute('playsinline',''); v.setAttribute('muted','');
      function afterSit(){                         // 이 동물이 앉음: sat 반짝+발음 → 잠깐 뒤 다음 동물
        if(done) return; done=true;
        if(onSit)onSit();
        if(isLast){ if(onAllDone)onAllDone(); }
        else setTimeout(function(){ playAt(k+1); }, GAP);
      }
      v.addEventListener('error',function(){ if(done)return; done=true; playAt(k+1); },{once:true}); // 이 영상 없음 → 앉음 없이 다음
      v.addEventListener('loadeddata',function(){
        videoBox.textContent=''; videoBox.appendChild(v);  // 앞 영상 치우고 새 영상 넣기
        var p=v.play(); if(p&&p.catch) p.catch(function(){});
      },{once:true});
      v.addEventListener('ended',afterSit,{once:true}); // 앉는 순간
      v.addEventListener('loadedmetadata',function(){ // 안전장치: ended 미발생 시 길이+여유 뒤 앉음 처리
        var ms=((isFinite(v.duration)&&v.duration>0)? v.duration*1000 : 6000)+1500;
        setTimeout(afterSit, ms);
      },{once:true});
    }catch(e){ if(!done){ done=true; playAt(k+1); } }
  })(0);
}
/* 실측 글자 맞춤(fitWord 패턴): 공식 대신 실제 폭을 재서 줄임 */
function fitWord(sp){
  sp.style.fontSize='30vw';
  var max=stage.getBoundingClientRect().width*0.86;
  for(var g=0;g<12&&sp.offsetWidth>max;g++){ // offsetWidth: 팝 애니메이션(scale) 영향 없는 실측 폭
    sp.style.fontSize=(parseFloat(getComputedStyle(sp).fontSize)*0.92)+'px';
  }
}
replayBtn.addEventListener('click',build);
build();
</script>
</body>
</html>
