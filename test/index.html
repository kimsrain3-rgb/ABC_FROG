<!DOCTYPE html>
<html lang="ko">
<head>
<!-- ★ 테스트 환경: 상위 폴더(라이브)의 assets/style.css를 그대로 쓰되, script만 test/script.js(후보 코드)를 로드 -->
<base href="../">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABC Frog (TEST)</title>
<meta name="theme-color" content="#4CAF50">
<!-- 홈 화면에 추가하면 라이브 앱처럼 전체화면(주소창 없음) → 크기·글자 라이브와 동일 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ABC Frog TEST">
<link rel="manifest" href="test/manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
<!-- 캐시 무력화: 매 실행마다 다른 주소로 불러 항상 최신 CSS 받기 (style.css는 라이브 공유) -->
<script>document.write('<link rel="stylesheet" href="style.css?b=' + Date.now() + '">');</script>
</head>
<body>
<div id="gc">
  <div class="ss" id="ss">
    <img class="sf" src="assets/images/frog_4a.png" alt="ABC Frog">
    <h1>ABC Frog</h1>
    <div class="sub">I'm hungry~</div>
    <div class="mode-buttons">
      <button class="game-card card-abc" onclick="goModeSelect()">
        <span class="card-icon"><img src="assets/images/fly_front.png" alt="catch"></span>
        <span class="card-label">ABC</span>
      </button>
      <button class="game-card card-word" onclick="goWordCat()">
        <span class="card-icon" id="wordBtnIcon"><img src="assets/images/fruit_apple.png?v=1" alt="Word"></span>
        <span class="card-label">Word</span>
      </button>
    </div>
  </div>

  <!-- 단어 퍼즐 카테고리 선택 (과일 / 동물 / 채소) -->
  <div class="wc" id="wc">
    <button class="wc-back" onclick="wcBack()">‹</button>
    <img class="wc-frog" src="assets/images/frog_4a.png" alt="frog">
    <h2 class="wc-title">Pick a puzzle! 🧩</h2>
    <div class="wc-cards">
      <button class="game-card wc-card wc-fruit" onclick="goWordPuzzle()">
        <span class="card-icon">🍎</span>
        <span class="card-label">Fruit</span>
      </button>
      <button class="game-card wc-card wc-locked" onclick="wcLocked(this)">
        <span class="card-icon">🐾</span>
        <span class="card-label">Animal</span>
        <span class="wc-lock">🔒</span>
      </button>
      <button class="game-card wc-card wc-locked" onclick="wcLocked(this)">
        <span class="card-icon">🥕</span>
        <span class="card-label">Vegetable</span>
        <span class="wc-lock">🔒</span>
      </button>
    </div>
    <div class="wc-toast" id="wcToast">Coming soon! 곧 나와요 🔜</div>
  </div>

  <!-- 단어 퍼즐 화면 (그림 직소 퍼즐) -->
  <div class="wp" id="wp">
    <button class="wp-back" onclick="wpBack()">‹</button>
    <h2 class="wp-title" id="wpTitle">🧩 Make the apple!</h2>
    <div class="wp-stage" id="wpStage"></div>
  </div>

  <!-- ABC 모드 선택 화면 (파리 잡기 글자 모드 고르기) -->
  <div class="ms" id="ms">
    <button class="ms-back" onclick="msBack()">‹</button>
    <img class="ms-frog" src="assets/images/frog_4a.png" alt="frog">
    <h2 class="ms-title">Which letter?</h2>
    <div class="ms-buttons">
      <button class="mbtn mbtn-abc" onclick="goMode('ABC')"><span class="mbtn-label">ABC</span></button>
      <button class="mbtn mbtn-lower" onclick="goMode('abc')"><span class="mbtn-label">abc</span></button>
      <button class="mbtn mbtn-mix" onclick="goMode('ABc')"><span class="mbtn-label">ABc</span></button>
    </div>
  </div>
  <div class="sc" id="sc">🌟 0</div>
  <div class="cb" id="cb"></div>
  <div class="bubble" id="bbl"></div>

  <div class="lilypad"><img src="assets/images/lilypad.png" alt="lilypad"></div>
  <div class="stump"><img src="assets/images/bg_5-1.png" alt="stump"></div>

  <div class="frog" id="frog">
    <!-- 5단계 개구리 (각 단계: a=숨쉬기A, b=숨쉬기B, open=입벌림) -->
    <!-- 1단계 (홀쭉) -->
    <img id="fs1a" class="frog-img active" src="assets/images/frog_1a.png" alt="frog1a" data-stage="1" data-pose="a">
    <img id="fs1b" class="frog-img" src="assets/images/frog_1b.png" alt="frog1b" data-stage="1" data-pose="b">
    <img id="fs1o" class="frog-img" src="assets/images/frog_1_open.png" alt="frog1open" data-stage="1" data-pose="open">
    <img id="fs1y" class="frog-img" src="assets/images/frog_1_yuck.png" alt="frog1yuck" data-stage="1" data-pose="yuck">
    <!-- 2단계 (조금) -->
    <img id="fs2a" class="frog-img" src="assets/images/frog_2a.png" alt="frog2a" data-stage="2" data-pose="a">
    <img id="fs2b" class="frog-img" src="assets/images/frog_2b.png" alt="frog2b" data-stage="2" data-pose="b">
    <img id="fs2o" class="frog-img" src="assets/images/frog_2b_open.png" alt="frog2open" data-stage="2" data-pose="open">
    <img id="fs2y" class="frog-img" src="assets/images/frog_2_yuck.png" alt="frog2yuck" data-stage="2" data-pose="yuck">
    <!-- 3단계 (통통) -->
    <img id="fs3a" class="frog-img" src="assets/images/frog_3a.png" alt="frog3a" data-stage="3" data-pose="a">
    <img id="fs3b" class="frog-img" src="assets/images/frog_3b.png" alt="frog3b" data-stage="3" data-pose="b">
    <img id="fs3o" class="frog-img" src="assets/images/frog_3_open.png" alt="frog3open" data-stage="3" data-pose="open">
    <img id="fs3y" class="frog-img" src="assets/images/frog_3_yuck.png" alt="frog3yuck" data-stage="3" data-pose="yuck">
    <!-- 4단계 (뚜뚜) -->
    <img id="fs4a" class="frog-img" src="assets/images/frog_4a.png" alt="frog4a" data-stage="4" data-pose="a">
    <img id="fs4b" class="frog-img" src="assets/images/frog_4b.png" alt="frog4b" data-stage="4" data-pose="b">
    <img id="fs4o" class="frog-img" src="assets/images/frog_4_open.png" alt="frog4open" data-stage="4" data-pose="open">
    <img id="fs4y" class="frog-img" src="assets/images/frog_4_yuck.png" alt="frog4yuck" data-stage="4" data-pose="yuck">
    <!-- 5단계 (만삭) -->
    <img id="fs5a" class="frog-img" src="assets/images/frog_5a.png" alt="frog5a" data-stage="5" data-pose="a">
    <img id="fs5b" class="frog-img" src="assets/images/frog_5b.png" alt="frog5b" data-stage="5" data-pose="b">
    <img id="fs5o" class="frog-img" src="assets/images/frog_5_open.png" alt="frog5open" data-stage="5" data-pose="open">
    <img id="fs5y" class="frog-img" src="assets/images/frog_5_yuck.png" alt="frog5yuck" data-stage="5" data-pose="yuck">
  </div>

  <div class="tongue" id="tng"></div>
  <div id="fc"></div>
  <div class="cbar" id="cb2"></div>
</div>

<div id="rotate-warn">
  <div class="rw-icon">📱</div>
  <div class="rw-t1">Turn your phone upright!</div>
  <div class="rw-t2">휴대폰을 세로로 세워주세요</div>
</div>

<!-- 작은 테스트 표시 -->
<div style="position:fixed;bottom:4px;left:6px;z-index:99999;font:11px sans-serif;color:#fff;background:rgba(220,90,40,.85);padding:2px 7px;border-radius:8px;pointer-events:none">TEST</div>

<!-- 캐시 무력화: 매 실행마다 다른 주소로 test/script.js(후보 코드) 항상 최신 로드 -->
<script>document.write('<scr' + 'ipt src="test/script.js?b=' + Date.now() + '"><\/scr' + 'ipt>');</script>
<script>
// 서비스워커/캐시 자동 정리 — 시크릿 탭 없이도 항상 최신 (라이브 index.html과 동일 자가복구)
try {
  if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(reg){ try { reg.unregister(); } catch (e) {} });
    }).catch(function(){});
  }
  if (window.caches && caches.keys) {
    caches.keys().then(function(keys){
      keys.forEach(function(k){ try { caches.delete(k); } catch (e) {} });
    }).catch(function(){});
  }
} catch (e) {}
</script>
</body>
</html>
