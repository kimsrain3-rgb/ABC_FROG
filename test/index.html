<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABC Frog TEST</title>
<meta name="theme-color" content="#4CAF50">
<!-- 홈화면 추가 시 전체화면(앱과 동일 크기) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ABC Frog TEST">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../assets/ui/icons/icon-192x192.png">
<style>html,body{margin:0;height:100%;background:#4CAF50;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;font-size:18px}</style>
</head>
<body>
<div>로딩중… 🐸</div>
<!--
  ★ 테스트 런처: 아이콘 누를 때마다 '항상 최신' 테스트 콘텐츠를 캐시 무력화로 불러온다.
  실제 테스트 내용은 아래 location.replace 가 가리키는 파일에 들어있고, 그것만 갈아끼우면 됨(이 런처는 거의 안 바뀜).
  2026-08-29 현재 → current-fitframe.html (퍼즐·파닉스 폰 비율 고정 · 넓은 화면에서 좌우 여백).
  앞 판들은 안 지웠다 — 주소를 직접 치면 그대로 열린다: current-webp2.html(WebP 2차) · current-webp1.html(WebP 1차) · current.html(엔딩 영상) 등.
  current.html?b=<매번 다른 숫자> → 브라우저가 새 주소로 인식 → 항상 새로 받음(옛 캐시 안 뜸).
-->
<script>
try {
  // 옛 서비스워커 정리(있으면)
  if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ try{ r.unregister(); }catch(e){} }); }).catch(function(){});
  }
} catch (e) {}
// 항상 최신 테스트 페이지로 이동(캐시버스터)
location.replace('current-fitframe.html?b=' + Date.now());
</script>
</body>
</html>
