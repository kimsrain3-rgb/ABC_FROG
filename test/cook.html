<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f6eedb">
  <title>Frog's Little Kitchen · TEST</title>
  <link rel="manifest" href="manifest.json">
  <script>document.write('<link rel="stylesheet" href="cook.css?b='+Date.now()+'">');</script>
</head>
<body>
  <main class="app" id="app">
    <header class="frog-table">
      <div class="brand"><span class="test-tag">TEST</span><span>FROG'S LITTLE KITCHEN</span></div>
      <div class="frog-row"><div class="speech" id="speech" aria-live="polite"></div><div class="frog-art" id="frogArt" aria-label="Frog sitting at the table"></div></div>
    </header>
    <section class="lesson" aria-label="Cooking instruction">
      <div class="step-top"><span id="stepLabel"></span><span id="stepDots" class="step-dots" aria-label="Progress"></span></div>
      <div class="instruction" id="instruction" aria-live="polite"></div>
      <div class="hint" id="hint"></div>
    </section>
    <section class="work" id="work" aria-label="Cooking table">
      <div class="work-caption" id="workCaption"></div>
      <div class="work-visual" id="workVisual"></div>
      <div class="work-bottom"><div class="count" id="count" aria-live="polite"></div><button class="action" id="action" type="button"></button></div>
    </section>
    <section class="rail-block" aria-label="Ingredients">
      <div class="rail-title"><span>INGREDIENTS</span><span class="rail-note">↔ roll · ↑ drag</span></div>
      <div class="rail" id="ingredients"></div>
    </section>
    <section class="rail-block" aria-label="Tools">
      <div class="rail-title"><span>TOOLS</span><span class="rail-note">↔ roll · ↑ drag</span></div>
      <div class="rail" id="tools"></div>
    </section>
    <footer><span>One bowl of veggie soup</span><button id="restart" type="button">Start over ↻</button></footer>
  </main>
  <div id="dragGhost" aria-hidden="true"></div>
  <script>
    var cookBust = Date.now();
    document.write('<script src="cook-art.js?b='+cookBust+'"><\/script>');
    document.write('<script src="cook.js?b='+cookBust+'"><\/script>');
  </script>
</body>
</html>
