<!-- ★ 테스트 빌드 — 엔딩 축하 영상 + "26글자 채우기" 버튼 (2026-08-24)

     [무엇을 보는 판인가] 엔딩 7초 시점(왕관이 뜨던 자리)에 축하 영상
       assets/frog/videos/frog_lastdance.mp4 (8초·음악 있음)을 게임 화면 가득 트는 판이다.
       영상 안에 왕관 쓴 개구리가 춤추는 장면이 들어 있어, 게임의 왕관 👑 과 개구리 춤은 지웠다.

     [폰에서 볼 것]
       ① 소문자(abc) 모드로 들어가 🏁 26글자 채우기 를 누른다
          → 3.5초  "WELL DONE!" 말풍선 + 축하 음성        (예전 그대로)
          → 7초    ★ 축하 영상 시작 (음악과 함께)
                   왕관·개구리 춤은 안 나와야 한다 ← 이게 이번 판의 핵심
                   "ALPHABET MASTER!!" 말풍선 + 음성은 영상 위에 그대로 나온다
          → 9초    HOORAY 🎊 + 음성                        (예전 그대로)
          → 영상 끝(약 15초) PLAY AGAIN 버튼
       ② 음악과 축하 음성(you_did_it · hooray)이 같이 들린다 — 겹쳐 들리는지 꼼지파파가 판단하실 것
       ③ 대문자(ABC) · 섞기(ABc) 모드에서도 같은지
       ④ 비행기모드로 켜 보기 — 영상이 안 떠도 PLAY AGAIN 까지 가야 한다(가장 중요)

     [빠져나가는 길을 네 겹으로 뒀다]
       영상이 안 받아지든 회선이 끊기든 재생이 막히든 무슨 일이 있어도 PLAY AGAIN 까지 간다.
       ① 영상 끝  ② 영상 오류(원본 재시도 후)  ③ 4초 안에 재생이 시작 안 됨  ④ 무조건 26초 마감
       버튼은 새로 만들지 않고 **라이브가 만든 그 버튼**을 잠시 숨겼다 되돌려 쓴다(하는 일이 같다).
       라이브 버튼이 끝내 안 생기면 그때만 같은 버튼을 직접 만든다.

     [영상 3단계] videos/(966KB) · videos_650/(636KB) · videos_400/(385KB)
       회선 판정은 라이브 공용 파일 video-quality.js 의 결과(__vq.tier)를 그대로 쓴다.
       ⚠️ 라이브로 옮길 때는 video-quality.js 의 ALLOW_FILE 에 이 영상을 추가하고 pick() 으로 바꿀 것.

     [엔딩이 두 번 도는 것을 막은 방법 — 2겹]
       게임 시작 절차(go() 의 500ms 뒤 snr(), ABC 는 tut() 이 끝난 뒤)가 끝나기 전에 col 을 채우면
       그 시작용 snr() 도 "다 모았다" 갈래로 빠져 stc()(엔딩)가 두 번 돈다.
         ① gp==='playing' 이 되기 전에는 버튼이 안 눌린다 (흐리게 표시 + pointer-events 끔)
         ② stc() 를 감싸 **페이지당 한 번만** 통과시킨다
       ⚠️ 그 잠금이 영상 블록보다 **바깥쪽**에 있어야 영상이 두 개 뜨지 않는다
          → 파일 안에서 영상 블록이 26글자 버튼 블록보다 **먼저** 온다. 순서를 바꾸지 말 것.

     [라이브와의 관계]
       ⚠️ script.js · index.html · style.css 는 한 글자도 안 건드렸다.
          게임 코드는 라이브 것을 그대로 불러 쓰고, 엔딩 함수 stc() 를 이 파일 안에서 감싼다.
       ⚠️ 왕관 위치 미세조정(CROWN_NUDGE_PX)은 이 판에 없다 — 왕관 자체를 안 쓰기 때문이다.
          왕관 판을 보시려면 test/current-ending26.html 이 그대로 남아 있다.
-->

<script>document.write('<scr' + 'ipt src="error-tracker.js?b=' + Date.now() + '"><\/scr' + 'ipt>');</script>
<!-- ★ 부팅 가드 — script.js 가 도착하기 전에 눌린 버튼을 기억했다가, 도착 즉시 자동 실행한다.
     [문제] 시작화면 버튼은 HTML 만으로 즉시 보이고 눌린다. 그런데 그 버튼을 처리하는 함수
       (goModeSelect 등 11개)는 body 맨 끝의 script.js 가 다 받아진 뒤에야 생긴다.
       느린 네트워크에서 그 틈에 아이가 누르면 "Uncaught ReferenceError: goModeSelect is not defined"
       가 나고, script.js 의 window.onerror 가 이를 삼켜서 화면은 그냥 무반응이 됐다.
       (2026-08-05 GA4 game_error 실측: error_where=init 12건, 멕시코·필리핀·네팔에 집중)
     [원리] 진짜 함수가 오기 전까지 같은 이름의 '대기표' 함수를 미리 만들어 둔다.
       대기표가 불리면 무엇을 눌렀는지 기억만 해 두고, script.js 가 실행되면서 진짜 함수가
       대기표를 덮어쓴다(script.js 의 함수는 전부 function 선언이라 자동으로 덮어씀).
       그 직후 body 끝의 __bootFlush() 가 기억해 둔 것을 한 번 실행한다.
     [안전] 진짜 함수가 끝내 안 오면(로드 실패) 아무것도 실행하지 않는다 — 지금과 같은 상태로 남을 뿐,
       더 나빠지지 않는다. 전체가 try-catch 라 가드가 고장나도 게임은 그대로 돈다. -->
<script>
(function () {
  'use strict';
  try {
    var NAMES = ['goModeSelect','goWordCat','goWordPuzzle','goAnimalPuzzle','goDinoPuzzle',
                 'goMode','wcBack','wcLocked','msBack','wpBack','gcBack','goPhonics'];
    var stubs = {}, pending = null, dotsEl = null, ready = false;

    // 기다리는 중 표시(개구리 인사말 아래 점점점). style.css 가 아직 안 왔어도 보이게 인라인 스타일만 사용.
    function showDots() {
      try {
        if (dotsEl || ready) return;
        var host = document.querySelector('.ss .sub') || document.querySelector('.ss');
        if (!host) return;
        var st = document.createElement('style');
        st.textContent = '@keyframes bootBlink{0%,100%{opacity:.25}50%{opacity:.95}}';
        (document.head || document.documentElement).appendChild(st);
        dotsEl = document.createElement('div');
        dotsEl.id = 'bootWait';
        dotsEl.textContent = '• • •';
        dotsEl.style.cssText = 'font:700 22px/1 system-ui,sans-serif;color:#fff;text-align:center;' +
          'margin-top:8px;letter-spacing:3px;animation:bootBlink 1s infinite;' +
          'text-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none';
        if (host.parentNode) host.parentNode.insertBefore(dotsEl, host.nextSibling);
      } catch (e) {}
    }
    function hideDots() {
      try { if (dotsEl && dotsEl.parentNode) dotsEl.parentNode.removeChild(dotsEl); } catch (e) {}
      dotsEl = null;
    }

    // 대기표 함수 등록 — 마지막에 누른 것 하나만 기억(연타해도 한 번만 실행)
    for (var i = 0; i < NAMES.length; i++) {
      (function (n) {
        if (typeof window[n] === 'function') return;   // 이미 진짜가 있으면 절대 건드리지 않음
        stubs[n] = function () { pending = { n: n, a: [].slice.call(arguments) }; showDots(); };
        window[n] = stubs[n];
      })(NAMES[i]);
    }

    // 눌렀다는 느낌은 줘야 하므로 살짝 눌린 표시(로딩 중일 때만)
    document.addEventListener('click', function (ev) {
      try {
        if (ready) return;
        var t = ev && ev.target;
        var b = (t && t.closest) ? t.closest('.game-card,.gbk,.mbtn') : null;
        if (!b) return;
        b.style.transform = 'scale(.94)'; b.style.opacity = '.75';
        setTimeout(function () { try { b.style.transform = ''; b.style.opacity = ''; } catch (e) {} }, 200);
      } catch (e) {}
    }, true);

    // script.js(+frog-reactions.js) 실행 직후 호출 — 기억해 둔 버튼을 실행한다.
    // document.write 로 넣은 스크립트는 파서를 멈추고 동기 실행되므로, 이 함수가 불릴 시점엔 이미 로드가 끝나 있다.
    window.__bootFlush = function () {
      try {
        ready = true;
        hideDots();
        if (!pending) return;
        var p = pending; pending = null;
        var f = window[p.n];
        if (typeof f === 'function' && f !== stubs[p.n]) f.apply(null, p.a);   // 대기표가 아직 그대로면 실행 안 함
      } catch (e) {}
    };
    window.__bootState = function () { return { ready: ready, pending: pending && pending.n }; };  // 테스트 확인용
  } catch (e) {}
})();
</script>

  <!-- ★ 개구리 지연 로딩 (2026-08-14) — 18장은 `src` 가 아니라 `data-src` 다.
       [왜] 이 20장은 시작화면에서 한 장도 안 보인다(.frog z-index 22 가 .ss z-index 100 에 완전히 가려짐).

                frog-reactions.js 가 '로딩된 개구리 PNG' 로 발 위치를 재기 때문에 항상 한 장은 있어야 한다.

<!-- ★★★ [TEST 전용] 엔딩 축하 영상 ★★★
     엔딩 7초 시점(지금까지 왕관이 뜨던 자리)에 축하 영상을 게임 화면 가득 튼다.
     왕관 👑 과 개구리 춤은 영상 안에 들어 있어 겹치므로 이 판에서만 지운다.

     ⚠️ 라이브 파일(script.js · index.html · style.css)은 한 글자도 안 건드린다.
        엔딩 함수 stc() 를 이 파일 안에서 감싸는 방식이다.

     [무엇을 어디에 끼우나]
       0초  (엔딩 시작)  영상을 '조용히 받기 시작'한다 — 7초의 여유를 벌어 둔다
       3.5초             WELL DONE! + congrats            ← 그대로 (안 건드림)
       7초               ★ 영상 시작. 왕관·개구리 춤은 지움
                         "ALPHABET MASTER!!" 말풍선 + you_did_it 음성은 그대로 둔다
       9초               HOORAY 🎊 + hooray 음성          ← 그대로 (안 건드림)
       11초              라이브 PLAY AGAIN 버튼이 생기지만 → 영상 위를 덮지 않게 잠시 숨긴다
       영상 끝(약 15초)   ★ **마지막 장면에 그대로 멈춘다** + 숨겨 둔 그 버튼을 보여준다
                         게임 화면(개구리·연잎)으로 돌아가지 않는다.
                         아이가 안 누르면 계속 그 화면이다 — 시간이 지나도 안 돌아간다.

     [겹침 규칙 — 무엇이 영상 위에 보이나]
       영상은 z-index 26 이다. 개구리(22)는 가리고, 말풍선(28)·HOORAY(100)·폭죽(100)·
       PLAY AGAIN(110) 은 영상 위에 그대로 보인다.
       → 지우라고 하신 왕관·춤만 사라지고, 나머지는 하나도 안 없어진다.
       (전부 영상 뒤로 숨기길 원하시면 VIDEO_Z 를 200 으로 올리면 된다)

     [절대 규칙 — 아이가 못 빠져나가는 화면을 만들지 않는다]
       영상이 안 받아지든, 회선이 끊기든, 재생이 막히든, 무슨 일이 있어도
       PLAY AGAIN 까지 간다. 빠져나가는 길을 네 겹으로 둔다.
         ① 영상 끝(ended)          → 마지막 장면에 멈춘 채로 버튼
         ② 영상 오류(error)        → 티어 파일이면 원본으로 한 번 재시도.
                                    그래도 안 되면 **원래 엔딩 그대로 흘려보내고** 라이브가
                                    11초에 만드는 그 버튼을 쓴다 (서둘러 만들지 않는다)
         ③ 재생이 시작을 못 함      → 4초 기다리고 포기 → 위와 같음
         ④ 무조건 마감시각(26초)    → 위가 전부 실패해도 버튼. 12.5초까지도 라이브 버튼이
                                    안 생겼으면 그때만 똑같은 버튼을 직접 만든다
       stc() 자체가 도중에 넘어져도 ④ 가 살아 있어 버튼은 뜬다.

     [영상 화질 3단계 — 회선에 맞춰 자동]
       videos/(966KB) · videos_650/(636KB) · videos_400/(385KB)
       회선 판정은 라이브 공용 파일 video-quality.js 의 결과(__vq.tier)를 그대로 쓴다.
       ⚠️ __vq.pick() 은 쓰지 않는다 — 그 허용목록에 이 영상이 아직 없어서 원본만 돌려준다.
          라이브로 옮길 때는 video-quality.js 의 ALLOW_FILE 에 이 영상을 추가하고 pick() 으로 바꿀 것.

     ⚠️ 영상을 부르는 코드는 전부 함수 안에 있다. 최상위에 두면 첫 화면에서 1MB 를 받아 버린다
        (2026-08-15 소리 지연 로딩과 같은 함정).
-->
<script>document.write('<scr' + 'ipt src="video-quality.js?b=' + Date.now() + '"><\/scr' + 'ipt>');</script>
<script>
(function () {
  'use strict';

  // ── 손으로 바꿀 수 있는 값 ────────────────────────────────────────────────
  var VID_FILE   = 'frog_lastdance.mp4';
  var VID_VER    = '?v=20260824';   // 같은 이름으로 영상을 갈아끼우면 이 날짜를 바꾼다
  var SHOW_AT    = 7000;            // 엔딩 시작 후 몇 ms 에 영상을 트나 (= 왕관이 뜨던 시각)
  var START_WAIT = 4000;            // 튼 뒤 이 시간 안에 안 움직이면 포기하고 버튼으로
  var HARD_MS    = 26000;           // 무슨 일이 있어도 이때는 PLAY AGAIN 이 떠 있어야 한다
  var VIDEO_Z    = 26;              // 영상 층. 200 으로 올리면 말풍선·HOORAY 도 영상 뒤로 숨는다

  // ── 왕관은 이 판에서 안 보이게 한다 (영상 안에 왕관 쓴 개구리가 들어 있다) ──
  // 타이밍에 안 흔들리게 CSS 로 막는다. script.js 는 그대로 왕관을 만들지만 화면엔 안 나온다.
  try {
    var st = document.createElement('style');
    st.textContent =
      '#crown{display:none!important}' +
      '#endvid{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;' +
        'z-index:' + VIDEO_Z + ';background:#000;opacity:0;transition:opacity .35s;pointer-events:none}' +
      '#endvid.on{opacity:1}';
    (document.head || document.documentElement).appendChild(st);
  } catch (e) {}

  // ── 기록(GA4) — 부가 기능이다. 실패해도 게임은 그대로 간다 ────────────────
  // result·tier 는 이미 등록된 매개변수라 새로 등록할 것이 없다.
  function ga(result, tier) {
    try { if (typeof gtag === 'function') gtag('event', 'ending_video', { result: result, tier: tier || 'unknown' }); } catch (e) {}
  }

  // ── 회선에 맞는 주소 만들기 ───────────────────────────────────────────────
  function tierOf() {
    try { if (window.__vq && __vq.tier) return __vq.tier; } catch (e) {}
    return '4g';
  }
  function urlFor(t) {
    var dir = (t === '400') ? 'videos_400' : (t === '650') ? 'videos_650' : 'videos';
    return 'assets/frog/' + dir + '/' + VID_FILE + VID_VER;
  }

  // ── 여기부터가 실제 동작. 전부 함수 안이다 ────────────────────────────────
  function startEndingVideo() {
    var gcEl = document.getElementById('gc');
    if (!gcEl) return;                         // 게임판이 없으면 아무것도 안 한다(원래 엔딩 그대로)

    var tier    = tierOf();
    var vid     = null;
    var done    = false;                       // finish() 를 한 번만
    var started = false;                       // 영상이 실제로 움직였는가
    var retried = false;                       // 티어 → 원본 재시도를 한 번만
    var btnRef  = null;                        // 라이브 PLAY AGAIN 버튼
    var hideBtn = true;                        // 영상이 살아있는 동안만 버튼을 숨긴다
    var timers  = [];
    var T0      = Date.now();                  // 엔딩이 시작된 시각
    function later(fn, ms) { try { timers.push(setTimeout(fn, ms)); } catch (e) {} }
    function since() { return Date.now() - T0; }

    /* ── 빠져나가는 길 : 무슨 일이 있어도 여기로 온다 ───────────────────────
       끝난 이유에 따라 두 갈래다.
         · 영상이 끝까지 잘 나왔다('ended')  → **마지막 장면을 그대로 멈춰 둔다.**
                                              게임 화면(개구리·연잎)으로 돌아가지 않는다.
         · 그 밖(오류·재생실패·마감)         → 영상을 치우고 원래 엔딩 화면 그대로 둔다.
                                              멈출 영상이 애초에 없기 때문이다.
       두 갈래 모두 마지막에 PLAY AGAIN 을 띄운다.                             */
    function finish(reason) {
      if (done) return;
      done = true; hideBtn = false;
      try { ga(reason, tier); } catch (e) {}

      if (reason === 'ended' && vid) {
        freeze();                               // 마지막 장면 정지 — 아무도 안 치운다
      } else {
        try {
          if (vid) {
            try { vid.pause(); } catch (e) {}
            vid.classList.remove('on');
            var v = vid;
            setTimeout(function () {
              try { v.removeAttribute('src'); v.load(); } catch (e) {}
              try { if (v.parentNode) v.parentNode.removeChild(v); } catch (e) {}
            }, 400);
          }
        } catch (e) {}
      }
      try { showPlayAgain(); } catch (e) {}
    }

    /* ── 마지막 장면에 멈춰 세우기 ─────────────────────────────────────────
       영상이 끝나면 <video> 는 **마지막으로 그린 프레임을 그대로 계속 보여준다.**
       그래서 요소를 지우지만 않으면 그 장면이 화면에 남는다.
       · 반복(loop)은 켜지 않는다 — 원래 꺼져 있고, 여기서 한 번 더 못박는다
       · 시간이 지나도 아무것도 이 영상을 치우지 않는다.
         26초 마감 타이머가 나중에 울려도 done 이 이미 참이라 그냥 돌아간다
       · pointer-events:none 이라 위에 뜬 PLAY AGAIN 이 그대로 눌린다          */
    function freeze() {
      try {
        vid.loop = false;
        vid.pause();
        vid.classList.add('on');                // 계속 보이게 (혹시 빠졌으면 다시 넣는다)
        vid.style.opacity = '1';
      } catch (e) {}
    }

    /* ── PLAY AGAIN 을 확실히 띄운다 ───────────────────────────────────────
       ⚠️ **서둘러 만들지 않는다.** 영상이 시작하자마자 실패했다고(예: 파일 404)
          그 자리에서 버튼을 만들면, 폭죽·WELL DONE 이 나오기도 전인 0.1초에
          PLAY AGAIN 이 떠서 아이가 축하를 통째로 건너뛰게 된다.
          (2026-08-24 404 검증에서 실제로 108ms 에 떴다 — 그래서 아래처럼 고쳤다)
       영상이 실패하면 **원래 엔딩 그대로** 흘러가게 두고, 라이브가 11초에 만드는
       그 버튼을 기다렸다가 보여준다. 그마저 안 생기면 그때(12.5초) 직접 만든다. */
    var BTN_FLOOR = 12500;                     // 이 시각 전에는 우리가 버튼을 만들지 않는다
    var ensuring  = false;
    function showPlayAgain() {
      try {
        if (btnRef && btnRef.parentNode) { btnRef.style.display = ''; return; }
        var found = findLiveBtn();
        if (found) { btnRef = found; found.style.display = ''; return; }
        if (ensuring) return;
        ensuring = true;
        // 라이브 버튼이 생기는지 지켜본다. 안 생기면 마감시각에 직접 만든다.
        var iv = setInterval(function () {
          try {
            var b = findLiveBtn();
            if (b) { btnRef = b; b.style.display = ''; clearInterval(iv); return; }
            if (since() >= BTN_FLOOR) { clearInterval(iv); makeOwnBtn(); }
          } catch (e) { try { clearInterval(iv); } catch (e2) {} }
        }, 200);
      } catch (e) {}
    }

    // 최후의 안전망 — 라이브 버튼이 끝내 안 생겼을 때만 똑같은 것을 직접 만든다
    function makeOwnBtn() {
      try {
        if (document.getElementById('evPlayAgain')) return;
        if (findLiveBtn()) return;
        var b = document.createElement('button');
        b.id = 'evPlayAgain';
        b.textContent = 'PLAY AGAIN';
        b.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);' +
          'padding:3vmin 8vmin;font-size:5vmin;font-weight:bold;color:#fff;' +
          'background:linear-gradient(135deg,#FF6F00,#FF9800);border:none;border-radius:12vmin;' +
          'cursor:pointer;z-index:110;box-shadow:0 4px 15px rgba(0,0,0,0.3);';
        b.onclick = function () { location.reload(); };
        gcEl.appendChild(b);
      } catch (e) {}
    }

    function findLiveBtn() {
      try {
        var bs = gcEl.querySelectorAll('button');
        for (var i = 0; i < bs.length; i++) {
          if (bs[i].id === 'evPlayAgain') continue;
          if ((bs[i].textContent || '').trim() === 'PLAY AGAIN') return bs[i];
        }
      } catch (e) {}
      return null;
    }

    /* ── 라이브 PLAY AGAIN(11초)이 영상 위를 덮지 않게 잠시 숨긴다 ──────────
       버튼을 새로 만들지 않고 라이브 것을 그대로 쓴다 → 누르면 하는 일이 완전히 같다. */
    var mo = null;
    try {
      mo = new MutationObserver(function () {
        try {
          var b = findLiveBtn();
          if (!b) return;
          btnRef = b;
          if (hideBtn) b.style.display = 'none';   // 영상이 끝나면 finish() 가 되돌린다
          else b.style.display = '';
          if (mo) { mo.disconnect(); mo = null; }
        } catch (e) {}
      });
      mo.observe(gcEl, { childList: true });
    } catch (e) {}
    // 관찰기가 없는 환경(아주 옛 WebView)을 위한 보조 — 11초 근처에 한 번씩 찾아본다
    later(function () { try { var b = findLiveBtn(); if (b) { btnRef = b; if (hideBtn) b.style.display = 'none'; } } catch (e) {} }, 11200);
    later(function () { try { var b = findLiveBtn(); if (b) { btnRef = b; if (hideBtn) b.style.display = 'none'; } } catch (e) {} }, 12000);

    // ── 개구리 춤 지우기 ─────────────────────────────────────────────────
    // script.js 가 7초에 frog.className='frog dancing' 을 준다. 그 뒤에 'dancing' 만 뗀다.
    // (한 번만 떼면 타이밍이 어긋날 수 있어 잠깐 동안 지켜본다)
    try {
      var dv = setInterval(function () {
        try {
          var fr = document.querySelector('.frog');
          if (fr && fr.classList.contains('dancing')) fr.classList.remove('dancing');
        } catch (e) {}
      }, 120);
      later(function () { try { clearInterval(dv); } catch (e) {} }, 12000);
    } catch (e) {}

    /* ── 영상 만들기 : 엔딩이 시작되는 지금 '받기'만 시작한다 ────────────────
       7초 뒤에 틀 것을 지금부터 받아 두면 느린 회선에서도 끊길 확률이 줄어든다.
       ⚠️ 받는 것과 트는 것이 같은 <video> 한 개다 — 따로 받아 두면 브라우저가
          재생할 때 처음부터 다시 받는다(2026-08-20 C-3 에서 실측된 함정).      */
    try {
      vid = document.createElement('video');
      vid.id = 'endvid';
      vid.setAttribute('playsinline', '');
      vid.setAttribute('webkit-playsinline', '');
      vid.preload = 'auto';
      vid.controls = false;
      vid.src = urlFor(tier);

      vid.addEventListener('playing', function () { started = true; });
      vid.addEventListener('ended',   function () { finish('ended'); });
      vid.addEventListener('error',   function () {
        // 티어 파일이 없거나 깨졌으면 원본으로 딱 한 번 재시도한다
        if (!retried && tier !== '4g') {
          retried = true;
          try { if (window.__vq && __vq.reportFallback) __vq.reportFallback(tier, 'ending'); } catch (e) {}
          try { vid.src = urlFor('4g'); vid.load(); if (shown) tryPlay(); return; } catch (e) {}
        }
        finish('error');
      });

      gcEl.appendChild(vid);
    } catch (e) {
      vid = null;
      finish('no_video');          // 영상을 못 만들면 원래 엔딩 그대로 흘러가고 버튼도 그대로 뜬다
      return;
    }

    // ── 7초 : 튼다 ───────────────────────────────────────────────────────
    var shown = false;
    function tryPlay() {
      try {
        var p = vid.play();
        if (p && typeof p.catch === 'function') {
          p['catch'](function () {
            // 소리 때문에 막혔을 수 있다 → 소리를 끄고 한 번 더 (그림이라도 보여준다)
            try {
              vid.muted = true;
              var p2 = vid.play();
              if (p2 && typeof p2.catch === 'function') p2['catch'](function () { finish('blocked'); });
            } catch (e2) { finish('blocked'); }
          });
        }
      } catch (e) { finish('blocked'); }
    }

    later(function () {
      if (done) return;
      shown = true;
      try { vid.classList.add('on'); } catch (e) {}
      tryPlay();
      // 이 안에 안 움직이면 포기하고 버튼으로 간다
      later(function () { if (!started && !done) finish('stall'); }, START_WAIT);
    }, SHOW_AT);

    // ── 마지막 안전망 : 위가 전부 실패해도 여기서 끝낸다 ────────────────────
    later(function () { finish('timeout'); }, HARD_MS);
    later(function () { try { for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]); } catch (e) {} }, HARD_MS + 4000);
  }

  /* ── 엔딩 함수 감싸기 ───────────────────────────────────────────────────
     ⚠️ 이 블록은 아래 '26글자 채우기' 버튼 블록보다 **먼저** 실행되어야 한다.
        그래야 그쪽의 '한 번만' 잠금이 바깥쪽에 놓여, 엔딩이 두 번 불려도
        영상이 두 개 뜨지 않는다.                                            */
  try {
    if (typeof stc === 'function' && !stc.__endvid) {
      var _stc = stc;
      window.stc = function () {
        var r;
        // 원래 엔딩이 먼저다. 여기서 넘어져도 영상·버튼 절차는 계속 간다.
        try { r = _stc.apply(this, arguments); } catch (e) {}
        try { startEndingVideo(); } catch (e) {}
        return r;
      };
      window.stc.__endvid = 1;
    }
  } catch (e) {}
})();
</script>
