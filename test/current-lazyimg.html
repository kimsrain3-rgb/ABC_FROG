<!-- ★ 테스트 빌드 — 첫 화면 로딩 다이어트 (2026-08-14)
     목적: 오래만에 앱 켤 때 녹색 화면이 5초씩 보이던 문제. 첫 화면이 안 쓰는 그림을 너무 많이 받고 있었다.
     라이브 루트(index.html/script.js/style.css)는 한 글자도 안 건드린다.
     assets·style.css·script.js·frog-reactions.js 전부 라이브 공유, 변경은 이 파일 안에만 있다.
     GA4·에러추적은 뺐음(테스트 플레이가 실유저 통계에 안 섞이게).
     바탕: 라이브 index.html(2026-08-14 시점) 그대로 + 아래 세 군데 변경

       ① Word 버튼 아이콘  fruit_apple_image.png(1019x1200, 974KB) → fruit_apple_icon.png(194x228, 7KB)
          버튼은 34x34px 로 표시되는데 974KB 를 받고 있었다. 퍼즐용 원본은 그대로 둔다(script.js:1320 이 씀).

       ② #frog 개구리 19장  src → data-src (첫 화면에서 안 받음, 게임 들어갈 때 받음)
          ※ fs4a 만 src 를 남긴다 — frog_4a.png 는 시작화면 .sf 가 어차피 받는 파일이라 공짜이고,
            frog-reactions.js:146 이 "로딩된 개구리 PNG" 를 캔버스에 그려 발 위치를 재기 때문에
            항상 최소 한 장은 로딩돼 있어야 반응 클립이 제자리에 뜬다.

       ③ body 끝 <script>  — 지연 로딩 엔진 (라이브 갈 때 script.js 로 옮길 것)
          라이브에선 setFrame() 자체를 고치면 되지만, 테스트에선 script.js 가 라이브 공유 파일이라
          건드릴 수 없어 '감싸기(wrapper)' 로 같은 동작을 만든다. ★라이브 이식 때는 코드가 달라진다★

     ⚠️ loading="lazy" 를 쓰면 안 되는 이유: 20장 전부 display:none 이라 화면에 걸리지 않아
        브라우저가 영영 안 받는다(게임 들어가도 개구리가 안 나옴). 그래서 data-src 방식을 쓴다. -->
<base href="../">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<!-- 캐시 무력화: 매 실행마다 다른 주소로 불러 항상 최신 CSS 받기(버전번호 수동관리 불필요) -->
<script>document.write('<link rel="stylesheet" href="style.css?b=' + Date.now() + '">');</script>
<!-- 테스트 빌드라 GA4·에러추적 없음. script.js 가 gtag 를 부르므로 빈 함수만 세워둔다. -->
<script>window.gtag=window.gtag||function(){};</script>
<!-- ★ 부팅 가드 — script.js 가 도착하기 전에 눌린 버튼을 기억했다가, 도착 즉시 자동 실행한다.
     [문제] 시작화면 버튼은 HTML 만으로 즉시 보이고 눌린다. 그런데 그 버튼을 처리하는 함수
       (goModeSelect 등 11개)는 body 맨 끝의 script.js 가 다 받아진 뒤에야 생긴다.
       느린 네트워크에서 그 틈에 아이가 누르면 "Uncaught ReferenceError: goModeSelect is not defined"
       가 나고, script.js 의 window.onerror 가 이를 삼켜서 화면은 그냥 무반응이 됐다.
       (2026-08-05 GA4 game_error 실측: error_where=init 12건, 멕시코·필리핀·네팔에 집중)
     [원리] 진짜 함수가 오기 전까지 같은 이름의 '대기표' 함수를 미리 만들어 둔다.
       대기표가 불리면 무엇을 눌렀는지 기억만 해 두고, script.js 가 실행되면서 진짜 함수가
       대기표를 덮어쓴다(script.js 의 함수는 전부 function 선언이라 자동으로 덮어씀).
       그 직후 body 끝의 __bootFlush() 가 기억해 둔 것을 한 번 실행한다.
     [안전] 진짜 함수가 끝내 안 오면(로드 실패) 아무것도 실행하지 않는다 — 지금과 같은 상태로 남을 뿐,
       더 나빠지지 않는다. 전체가 try-catch 라 가드가 고장나도 게임은 그대로 돈다. -->
<script>
(function () {
  'use strict';
  try {
    var NAMES = ['goModeSelect','goWordCat','goWordPuzzle','goAnimalPuzzle','goDinoPuzzle',
                 'goMode','wcBack','wcLocked','msBack','wpBack','gcBack','goPhonics'];
    var stubs = {}, pending = null, dotsEl = null, ready = false;

    // 기다리는 중 표시(개구리 인사말 아래 점점점). style.css 가 아직 안 왔어도 보이게 인라인 스타일만 사용.
    function showDots() {
      try {
        if (dotsEl || ready) return;
        var host = document.querySelector('.ss .sub') || document.querySelector('.ss');
        if (!host) return;
        var st = document.createElement('style');
        st.textContent = '@keyframes bootBlink{0%,100%{opacity:.25}50%{opacity:.95}}';
        (document.head || document.documentElement).appendChild(st);
        dotsEl = document.createElement('div');
        dotsEl.id = 'bootWait';
        dotsEl.textContent = '• • •';
        dotsEl.style.cssText = 'font:700 22px/1 system-ui,sans-serif;color:#fff;text-align:center;' +
          'margin-top:8px;letter-spacing:3px;animation:bootBlink 1s infinite;' +
          'text-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none';
        if (host.parentNode) host.parentNode.insertBefore(dotsEl, host.nextSibling);
      } catch (e) {}
    }
    function hideDots() {
      try { if (dotsEl && dotsEl.parentNode) dotsEl.parentNode.removeChild(dotsEl); } catch (e) {}
      dotsEl = null;
    }

    // 대기표 함수 등록 — 마지막에 누른 것 하나만 기억(연타해도 한 번만 실행)
    for (var i = 0; i < NAMES.length; i++) {
      (function (n) {
        if (typeof window[n] === 'function') return;   // 이미 진짜가 있으면 절대 건드리지 않음
        stubs[n] = function () { pending = { n: n, a: [].slice.call(arguments) }; showDots(); };
        window[n] = stubs[n];
      })(NAMES[i]);
    }

    // 눌렀다는 느낌은 줘야 하므로 살짝 눌린 표시(로딩 중일 때만)
    document.addEventListener('click', function (ev) {
      try {
        if (ready) return;
        var t = ev && ev.target;
        var b = (t && t.closest) ? t.closest('.game-card,.gbk,.mbtn') : null;
        if (!b) return;
        b.style.transform = 'scale(.94)'; b.style.opacity = '.75';
        setTimeout(function () { try { b.style.transform = ''; b.style.opacity = ''; } catch (e) {} }, 200);
      } catch (e) {}
    }, true);

    // script.js(+frog-reactions.js) 실행 직후 호출 — 기억해 둔 버튼을 실행한다.
    // document.write 로 넣은 스크립트는 파서를 멈추고 동기 실행되므로, 이 함수가 불릴 시점엔 이미 로드가 끝나 있다.
    window.__bootFlush = function () {
      try {
        ready = true;
        hideDots();
        if (!pending) return;
        var p = pending; pending = null;
        var f = window[p.n];
        if (typeof f === 'function' && f !== stubs[p.n]) f.apply(null, p.a);   // 대기표가 아직 그대로면 실행 안 함
      } catch (e) {}
    };
    window.__bootState = function () { return { ready: ready, pending: pending && pending.n }; };  // 테스트 확인용
  } catch (e) {}
})();
</script>

<!-- 캐시 무력화: 매 실행마다 다른 주소로 불러 항상 최신 script.js 받기(푸시 즉시 전 유저 반영) -->
<script>document.write('<scr' + 'ipt src="script.js?b=' + Date.now() + '"><\/scr' + 'ipt>');</script>
<!-- 개구리 반응 클립 + 글자 반짝 효과 + 온보딩(튜토리얼 데모/손가락 안내). test/에서 검증 후 이식, script.js 전역함수를 감싸는 애드온이라 script.js 뒤에 로드. -->
<script>document.write('<scr' + 'ipt src="frog-reactions.js?b=' + Date.now() + '"><\/scr' + 'ipt>');</script>
<!-- ③★ 개구리 지연 로딩 엔진 — 라이브 반영 때 script.js 로 옮길 것.
     ⚠️ 라이브에선 setFrame() 원본을 직접 고치면 되므로 아래 '감싸기'는 필요 없다.
        테스트에선 script.js 가 라이브 공유 파일이라 못 고쳐서 감싸기로 같은 동작을 만든 것뿐이다.
     ★ __bootFlush() 보다 먼저 설치해야 한다 — 로딩 중에 눌러둔 ABC 버튼이 여기서 재생되기 때문. -->
<script>
(function(){
  'use strict';

  // 받는 순서 = 게임에서 쓰는 순서. 게임은 1단계(홀쭉)로 시작하므로 1단계가 맨 앞.
  // 2단계는 글자 6개를 모아야 나오므로(script.js:656 getStageFromCount) 한참 뒤에 필요하다.
  // fs1a·fs4a 는 이미 src 가 있어 목록에 없음.
  var ORDER = ['fs1b','fs1o','fs1y',
               'fs2a','fs2b','fs2o','fs2y',
               'fs3a','fs3b','fs3o','fs3y',
               'fs4b','fs4o','fs4y',
               'fs5a','fs5b','fs5o','fs5y'];

  // data-src → src (한 번만). 이 순간 브라우저가 받기 시작한다.
  function hydrate(el){
    if(!el) return el;
    var ds = el.getAttribute('data-src');
    if(ds){ el.removeAttribute('data-src'); el.src = ds; }
    return el;
  }
  // '지금 화면에 그릴 수 있는 상태인가'
  function ready(el){ return !!(el && el.complete && el.naturalWidth > 0); }

  // 한 번에 2장씩만 받는다.
  // [왜] 19장을 동시에 부르면 대역폭을 19등분해서 정작 게임 시작에 필요한 fs1a 가 제일 늦게 온다.
  //      2장씩 순서대로 받으면 1단계 그림이 최우선으로 도착한다(느린 네트워크에서 결정적).
  var MAX = 2, inflight = 0, queue = null, done = 0;

  function pump(){
    while(queue && inflight < MAX && queue.length){
      var el = document.getElementById(queue.shift());
      if(!el || !el.getAttribute('data-src')) continue;   // 없거나 이미 받은 건 건너뜀
      inflight++;
      var next = function(){ inflight--; done++; pump(); };
      el.addEventListener('load', next, {once:true});
      el.addEventListener('error', next, {once:true});    // 실패해도 줄이 멈추면 안 됨
      hydrate(el);
    }
  }

  function hydrateAll(){
    if(queue) return;            // 이미 시작함
    queue = ORDER.slice();
    pump();
  }

  // --- 받기 시작하는 지점 두 곳 ---
  // 1) ABC 카드를 누른 순간(= 모드 선택 화면). 실제 게임 시작보다 한 탭 앞이라 미리 받을 여유가 생긴다.
  var origGoModeSelect = window.goModeSelect;
  if(typeof origGoModeSelect === 'function'){
    window.goModeSelect = function(){ try{ hydrateAll(); }catch(e){}
      return origGoModeSelect.apply(this, arguments); };
  }
  // 2) 실제 게임 시작. 모드선택을 건너뛰고 들어오는 길(뒤로가기 복귀 등)도 있어 여기서 한 번 더 보장.
  var origGo = window.go;
  if(typeof origGo === 'function'){
    window.go = function(){ try{ hydrateAll(); }catch(e){}
      return origGo.apply(this, arguments); };
  }

  // --- 안전망: 아직 안 받아진 그림을 보여달라고 하면, 빈 개구리 대신 '이전 그림'을 유지한다 ---
  // setFrame() 은 display 만 바꾸고 src 는 안 건드리므로(script.js:678) 이 보호막이 없으면
  // 그림이 늦게 오는 동안 개구리가 사라진다. 사장님 요구사항: "안 나오거나 깜빡이면 안 됨".
  var origSetFrame = window.setFrame;
  var wantEl = null;

  function showOnly(el){
    var all = document.querySelectorAll('#frog .frog-img');
    for(var i=0;i<all.length;i++){
      if(all[i] === el) continue;
      all[i].style.display='none'; all[i].classList.remove('active');
    }
    el.style.display='block'; el.classList.add('active');
  }

  // 원하는 그림이 아직 없을 때 '대신 보여줄 것' 고르기.
  // ★ 포즈(입벌림/뱉기)보다 단계(개구리 크기)가 훨씬 눈에 띈다 → 같은 단계의 다른 포즈를 먼저 쓴다.
  //   (안 그러면 1단계로 시작했는데 4단계 뚱뚱 개구리가 몇 초간 떠 있는 일이 생긴다)
  function bestFor(want){
    if(ready(want)) return want;
    var st = want.getAttribute('data-stage');
    var sibs = document.querySelectorAll('#frog .frog-img[data-stage="'+st+'"]');
    for(var i=0;i<sibs.length;i++){ if(ready(sibs[i])) return sibs[i]; }
    return null;                            // 이 단계 그림이 하나도 없다 → 지금 보이는 것 그대로 둔다
  }
  function applyFrame(){
    if(!wantEl) return;
    var el = bestFor(wantEl);
    if(el) showOnly(el);
  }

  if(typeof origSetFrame === 'function'){
    window.setFrame = function(pose){
      // 목표 프레임 고르기는 원본에 맡긴다 — 단계 변수(frogStage)가 let 이라 밖에서 읽을 수 없기 때문.
      var r = origSetFrame.apply(this, arguments);
      var want = document.querySelector('#frog .frog-img.active');
      if(!want) return r;
      wantEl = want;
      hydrate(want);                        // 급하니 줄을 서지 않고 바로 받는다
      applyFrame();
      return r;
    };
  }

  // ★ 그림이 하나 도착할 때마다 다시 판단한다.
  // [왜] 숨쉬기가 a↔b 를 1초마다 바꾸는데 느린 네트워크에선 그림이 3초씩 걸린다.
  //      "이 그림이 도착하면 그때 보여주자" 식으로 한 장만 노리면, 도착할 때마다 이미 다른 포즈를
  //      원하고 있어서 둘이 계속 엇갈리고 개구리가 옛 그림에 멈춰 있게 된다(실측으로 확인함).
  //      그래서 '아무 그림이나 도착하면 지금 상황에 맞는 최선을 다시 고르는' 방식으로 바꿨다.
  (function(){
    var all = document.querySelectorAll('#frog .frog-img');
    for(var i=0;i<all.length;i++){
      all[i].addEventListener('load', applyFrame);
    }
  })();

  // 검증용 훅(테스트에서만 씀)
  window.__frogLazy = {
    hydrateAll: hydrateAll,
    stats: function(){
      var all = document.querySelectorAll('#frog .frog-img'), pending = 0, loaded = 0;
      for(var i=0;i<all.length;i++){
        if(all[i].getAttribute('data-src')) pending++;
        if(ready(all[i])) loaded++;
      }
      return { total: all.length, pending: pending, loaded: loaded,
               started: !!queue, inflight: inflight, done: done };
    }
  };
})();
</script>
<!-- ★ 부팅 가드 마무리 — 위 두 스크립트가 동기 로드라 여기 오면 진짜 함수가 이미 준비됐다.
     로딩 중에 눌러 둔 버튼이 있으면 지금 한 번 실행한다(없으면 아무 일도 안 함). -->
<script>try{ if(window.__bootFlush) window.__bootFlush(); }catch(e){}</script>
<script>
// 캐시 도우미(서비스워커) 사용 안 함 — 앱은 항상 서버 최신을 직접 로드(푸시 즉시 반영).
// 과거에 등록된 서비스워커/캐시가 있으면 깨끗이 정리(자가 복구). 새로 등록은 하지 않음.
try {
  if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(reg){ try { reg.unregister(); } catch (e) {} });
    }).catch(function(){});
  }
  if (window.caches && caches.keys) {
    caches.keys().then(function(keys){
      keys.forEach(function(k){ try { caches.delete(k); } catch (e) {} });
    }).catch(function(){});
  }
} catch (e) {}
</script>
