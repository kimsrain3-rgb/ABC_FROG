<style>
/* ── 파리잡기 모드 버튼 (2026-09-14 4차: 첫 화면·파닉스와 같은 크기로) ──

/* 잠긴 3·4 카드의 SVG 는 박스를 꽉 채우지 않는다(62%). 라이브 style.css:380 이 100% 라 그냥 두면
   옛 30px 짜리가 70px 로 부풀어 조잡해 보인다. 박스는 같은 크기라 카드 높이는 1·2 와 맞는다. */
.ps-card .card-icon svg{width:62%;height:62%}

/* ── 첫 화면 카드 3장 (2026-09-14 3차) ──
   🔴 파닉스와 똑같은 함정이 여기에도 있었다 — 라이브 style.css:324
      `.mode-buttons .game-card .card-icon{width:34px;height:34px}`.
      아이콘 34px 옆에 글자가 28px 이라 글자가 먼저 눈에 들어왔다.
   파닉스 세트 카드와 같은 크기·같은 방식으로 맞춘다. */
.mode-buttons .game-card{width:272px;gap:10px}

/* 라이브 style.css:137 의 `.card-abc .card-icon img{transform:scale(1.3)}` 는 34px 시절 값이다.
   80px 에서 1.3 배면 104px 이 되어 박스를 12px 씩 넘어 글자를 친다 → 1.12 로 낮췄었다.
   2026-09-14 4차: 파리가 작아 보여 **그림만 20% 더** 키웠다 → 1.12 × 1.2 = 1.344.
   ⚠️ 박스(.card-icon)는 그대로 70px 이고 그림만 커진다. 박스 밖으로 나가지만 잘리지 않는다 —
      .card-icon·.game-card 에 overflow 가 없고, 자르는 조상은 화면 전체(#gc) 뿐이다.
   ⚠️ 한 <img> 의 src 만 갈아끼우므로 두 장에 **똑같은 배율**이 걸린다(한쪽만 커질 수 없다). */
.card-abc .card-icon .menu-anim-ic{transform:scale(1.344)}
/* 입 도형은 여백이 없어 박스를 꽉 채우면 파리·사과보다 혼자 커 보인다(그 둘은 그림에 투명 여백이 있다).
   라이브 style.css:328 이 svg{width:100%} 라 여기서만 88% 로 낮춘다. */
.mode-buttons .game-card .card-icon svg{width:88%;height:88%}
/* 사과 흔들기 — 회전은 CSS 가 부드럽게, 속도·시작시점은 script 의 HOME_ICON_MS/DELAY 가 넣는다 */
@keyframes homeAppleWobble{ from{transform:rotate(-7deg)} to{transform:rotate(7deg)} }
.mode-buttons .game-card .card-icon .home-apple-ic{transform-origin:50% 88%}
/* 🚩 첫 화면은 파닉스 메뉴보다 위쪽이 무겁다(개구리 + 큰 제목 'ABC Frog' + 'I'm hungry~').
      그래서 파닉스와 같은 단계(58px)를 쓰면 360×640 에서 마지막 카드가 6px 잘렸다 — 실측으로 잡았다.
      같은 화면 크기라도 화면마다 위에 실린 것이 달라 단계를 따로 잡아야 한다. */
@media (max-height:860px){ .mode-buttons .game-card .card-icon{width:70px;height:70px} }

#ps .wc-cards{gap:14px}
/* 짧은 화면에서 아이콘부터 줄인다 — 라이브의 @media(max-height) 들보다 뒤에 있어야 이깁니다.
   ⚠️ 카드 높이는 글자가 아니라 '아이콘'이 정한다(글자칸 20+3+15=38px < 아이콘 80px).
      그래서 폰 글자확대 130% 로 글자가 26px 이 돼도 카드가 안 높아진다 — 잘림은 폭에서만 생길 수 있다. */
/* 🚩 기준선을 800 이 아니라 860 으로 잡았다 — 실측으로 정한 값이다.
      아이콘 80px 이면 카드 4장이 506px 인데 805px 화면에서 카드가 302px 부터 시작해 3px 넘쳤다.
      "800 이하만 줄이면 되겠지"로 두면 801~860 짜리 폰에서만 마지막 카드가 잘린다. */
@media (max-height:860px){ .ps-card .card-icon{width:70px;height:70px} .ps-card{padding-top:12px;padding-bottom:12px} #ps .wc-cards{gap:12px} }

<!-- 파리잡기 화살표 진하기(.6)는 2026-08-31 라이브 style.css 에 반영됨 → 이 판에 따로 넣지 않는다 -->
<!-- 테스트 빌드라 GA4·에러추적 없음(테스트 플레이가 실유저 통계에 안 섞이게). script.js 가 gtag 를 부르므로 빈 함수만 세워둔다. -->
<script>window.gtag=window.gtag||function(){};</script>
<!-- ★ 부팅 가드 — script.js 가 도착하기 전에 눌린 버튼을 기억했다가, 도착 즉시 자동 실행한다.
     [문제] 시작화면 버튼은 HTML 만으로 즉시 보이고 눌린다. 그런데 그 버튼을 처리하는 함수
       (goModeSelect 등 11개)는 body 맨 끝의 script.js 가 다 받아진 뒤에야 생긴다.
       느린 네트워크에서 그 틈에 아이가 누르면 "Uncaught ReferenceError: goModeSelect is not defined"
       가 나고, script.js 의 window.onerror 가 이를 삼켜서 화면은 그냥 무반응이 됐다.
       (2026-08-05 GA4 game_error 실측: error_where=init 12건, 멕시코·필리핀·네팔에 집중)
     [원리] 진짜 함수가 오기 전까지 같은 이름의 '대기표' 함수를 미리 만들어 둔다.
       대기표가 불리면 무엇을 눌렀는지 기억만 해 두고, script.js 가 실행되면서 진짜 함수가
       대기표를 덮어쓴다(script.js 의 함수는 전부 function 선언이라 자동으로 덮어씀).
       그 직후 body 끝의 __bootFlush() 가 기억해 둔 것을 한 번 실행한다.
     [안전] 진짜 함수가 끝내 안 오면(로드 실패) 아무것도 실행하지 않는다 — 지금과 같은 상태로 남을 뿐,
       더 나빠지지 않는다. 전체가 try-catch 라 가드가 고장나도 게임은 그대로 돈다. -->
<script>
(function () {
  'use strict';
  try {
    var NAMES = ['goModeSelect','goWordCat','goWordPuzzle','goAnimalPuzzle','goDinoPuzzle',
                 'goMode','wcBack','wcLocked','msBack','wpBack','gcBack','goPhonics'];
    var stubs = {}, pending = null, dotsEl = null, ready = false;

    // 기다리는 중 표시(개구리 인사말 아래 점점점). style.css 가 아직 안 왔어도 보이게 인라인 스타일만 사용.
    function showDots() {
      try {
        if (dotsEl || ready) return;
        var host = document.querySelector('.ss .sub') || document.querySelector('.ss');
        if (!host) return;
        var st = document.createElement('style');
        st.textContent = '@keyframes bootBlink{0%,100%{opacity:.25}50%{opacity:.95}}';
        (document.head || document.documentElement).appendChild(st);
        dotsEl = document.createElement('div');
        dotsEl.id = 'bootWait';
        dotsEl.textContent = '• • •';
        dotsEl.style.cssText = 'font:700 22px/1 system-ui,sans-serif;color:#fff;text-align:center;' +
          'margin-top:8px;letter-spacing:3px;animation:bootBlink 1s infinite;' +
          'text-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none';
        if (host.parentNode) host.parentNode.insertBefore(dotsEl, host.nextSibling);
      } catch (e) {}
    }
    function hideDots() {
      try { if (dotsEl && dotsEl.parentNode) dotsEl.parentNode.removeChild(dotsEl); } catch (e) {}
      dotsEl = null;
    }

    // 대기표 함수 등록 — 마지막에 누른 것 하나만 기억(연타해도 한 번만 실행)
    for (var i = 0; i < NAMES.length; i++) {
      (function (n) {
        if (typeof window[n] === 'function') return;   // 이미 진짜가 있으면 절대 건드리지 않음
        stubs[n] = function () { pending = { n: n, a: [].slice.call(arguments) }; showDots(); };
        window[n] = stubs[n];
      })(NAMES[i]);
    }

    // 눌렀다는 느낌은 줘야 하므로 살짝 눌린 표시(로딩 중일 때만)
    document.addEventListener('click', function (ev) {
      try {
        if (ready) return;
        var t = ev && ev.target;
        var b = (t && t.closest) ? t.closest('.game-card,.gbk,.mbtn') : null;
        if (!b) return;
        b.style.transform = 'scale(.94)'; b.style.opacity = '.75';
        setTimeout(function () { try { b.style.transform = ''; b.style.opacity = ''; } catch (e) {} }, 200);
      } catch (e) {}
    }, true);

    // script.js(+frog-reactions.js) 실행 직후 호출 — 기억해 둔 버튼을 실행한다.
    // document.write 로 넣은 스크립트는 파서를 멈추고 동기 실행되므로, 이 함수가 불릴 시점엔 이미 로드가 끝나 있다.
    window.__bootFlush = function () {
      try {
        ready = true;
        hideDots();
        if (!pending) return;
        var p = pending; pending = null;
        var f = window[p.n];
        if (typeof f === 'function' && f !== stubs[p.n]) f.apply(null, p.a);   // 대기표가 아직 그대로면 실행 안 함
      } catch (e) {}
    };
    window.__bootState = function () { return { ready: ready, pending: pending && pending.n }; };  // 테스트 확인용
  } catch (e) {}
})();
</script>

<!-- ★ [TEST 전용] 판 표시 — 라이브 반영 때 가져가지 않는다 -->
<style>#bgmnote{position:fixed;left:10px;top:78px;z-index:99999;pointer-events:none;
  background:rgba(0,0,0,.72);color:#fff;font:600 11px/1.45 "Segoe UI",sans-serif;
  padding:6px 10px;border-radius:7px;max-width:66vw;transition:opacity 1s}</style>
<div id="bgmnote">🐸 <b>TEST 판</b><br><span style="opacity:.8">배포 시각 확인 중…</span></div>
<script>
/* ★ [TEST 전용] 자동 판 표시 (2026-09-07 교체)
   ─────────────────────────────────────────────────────────────────────────
   왜 바꿨나 — 여기엔 원래 "(2026-09-02 ②)" 같은 **손으로 적은 날짜**가 있었다.
   그런데 판을 갈아끼울 때 알맹이(script-phset.js·phonics/*)만 고치고 이 줄은
   그대로 두는 일이 반복돼, 9/4 판을 보면서 9/2 날짜를 읽고 "옛날 화면인가?"
   하고 오해하는 일이 실제로 벌어졌다. test/index.html 주석에도 같은 경고가
   이미 적혀 있었지만 사람이 지키는 규칙이라 또 새어나갔다.
   → **손으로 적는 날짜를 없애고 서버가 말해주는 값만 보여준다.**

   무엇을 보여주나
     ① 배포 시각 = 이 파일들의 HTTP Last-Modified.
        GitHub Pages 는 배포할 때마다 전체 파일의 이 값을 갱신하므로
        **"이 화면이 언제 올라간 판인가" 를 그대로 가리킨다.**
     ② 알맹이 파일의 바이트 수 = 내용이 바뀌면 같이 바뀐다.
        Pages 는 **푸시가 있어야만 배포**되므로, "올렸습니다" 직후에 이 시각이
        방금이면 내가 고친 것이 들어간 것이다.
     ② 지금 열려 있는 알맹이 파일 이름(공짜 — 네트워크를 안 쓴다).
        판을 갈아끼우면 여기가 같이 바뀌므로 "어느 판인가" 가 눈으로 갈린다.

   🚩 **파일 크기(Content-Length)는 일부러 안 쓴다** (2026-09-07 실측으로 뺐다).
      브라우저는 gzip 으로 받기 때문에 `Content-Length` 가 **압축된 크기**로 온다
      — `script-phset.js` 가 199,567 인데 화면엔 65,781 로 떴다.
      내 컴퓨터에서 보는 크기와 안 맞아 오히려 "뭐가 잘못됐나" 로 읽힌다.
      (curl 로 재면 압축을 안 걸어 199,567 이 나와서 처음엔 못 알아챘다 —
       **헤더 검증은 브라우저가 실제로 받는 조건으로 해야 한다.**)

   ⚠️ 이 블록은 **라이브에 가져가지 않는다**(테스트 판 확인용).
   ⚠️ 실패해도 게임은 그대로 돌아야 한다 — 전부 try-catch + .catch() 로 감쌌고
      값을 못 받으면 "확인 실패" 만 적고 끝난다(게임 코드는 한 줄도 안 건드렸다). */
(function(){
  var EL = document.getElementById('bgmnote');
  if (!EL) return;
  // 알맹이 파일들. 주소는 <base href="../"> 기준(= 저장소 뿌리).
  var WATCH = [
    { url:'test/script-menuicon.js',      name:'script-menuicon.js' },
    { url:'assets/phonics/icons/set1_a.webp', name:'icons/set1_a' }
  ];
  function two(n){ return (n<10?'0':'') + n; }
  function stamp(d){
    return two(d.getMonth()+1) + '-' + two(d.getDate()) + ' ' +
           two(d.getHours()) + ':' + two(d.getMinutes());
  }
  function head(f){
    // cache:'no-store' — 표시용 조회가 캐시에 걸려 옛 값을 보여주면 뜻이 없다.
    return fetch(f.url + '?b=' + Date.now(), { method:'HEAD', cache:'no-store' })
      .then(function(r){
        if (!r.ok) return null;
        return { name:f.name, lm:r.headers.get('last-modified') };
      })
      .catch(function(){ return null; });
  }
  // 지금 열려 있는 알맹이 파일 이름(네트워크를 안 쓴다)
  var PAGE = (location.pathname.split('/').pop() || 'index.html');
  try {
    if (!window.fetch) { EL.innerHTML = '🐸 <b>TEST 판</b><br><span style="opacity:.8">(이 브라우저는 자동 확인 불가)</span>'; return; }
    Promise.all(WATCH.map(head)).then(function(rs){
      try {
        var got = rs.filter(function(x){ return x; });
        if (!got.length) { EL.innerHTML = '🐸 <b>TEST 판</b><br><span style="opacity:.8">배포 시각 확인 실패(오프라인?)</span>'; return; }
        // 가장 최근 시각 하나를 대표로 쓴다(Pages 는 보통 전부 같은 값이다).
        var newest = null;
        got.forEach(function(x){
          if (!x.lm) return;
          var d = new Date(x.lm);
          if (!isNaN(d) && (!newest || d > newest)) newest = d;
        });
        EL.innerHTML =
          '🐸 <b>TEST 판 · 배포 ' + (newest ? stamp(newest) : '?') + '</b>' +
          '<br><span style="opacity:.8">알맹이: ' + PAGE +
          '<br>위 시각이 방금 올린 때가 아니면 옛 화면입니다</span>';
      } catch (e) {}
    }).catch(function(){});
  } catch (e) {}
})();
setTimeout(function(){try{var n=document.getElementById("bgmnote");if(n)n.style.opacity="0";}catch(e){}},15000);
</script>
