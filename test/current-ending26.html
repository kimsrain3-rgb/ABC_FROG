     [목적] 엔딩(왕관·폭죽·축하 음성)을 폰에서 확인하려면 26글자를 다 모아야 하는데
            너무 오래 걸린다. 버튼 하나로 그 상태를 만들어 엔딩을 바로 띄운다.

     [지금 무엇을 보는가] 2026-08-24 라이브 반영된 abc(소문자) 엔딩 버그 수정(커밋 aef3115)이
            본게임 앱(WebView)에서도 제대로 도는가. 상세는 docs/CHANGELOG.md 2026-08-24 참고.

     [폰에서 볼 것]
       ① 소문자(abc) 모드로 들어가 버튼을 누른다
          → 3.5초 "WELL DONE!" 말풍선 + 축하 음성
          → 7초   왕관 👑 + "ALPHABET MASTER!!" + 음성 + 개구리 춤 + 폭죽
          → 9초   HOORAY 🎊
          ★ 이 중 하나라도 빠지면 수정이 앱에 안 들어간 것
       ② 대문자(ABC) · 섞기(ABc) 모드에서도 같은 엔딩이 나오는가
       ③ 엔딩이 **한 번만** 도는가 (말풍선·음성이 겹쳐 들리면 안 된다)

     [엔딩이 두 번 도는 것을 막은 방법 — 2겹]
       2026-08-24 검증 때 실제로 겪은 문제다. 게임 시작 절차(go() 의 500ms 뒤 snr(),
       ABC 는 tut() 이 끝난 뒤)가 끝나기 전에 col 을 채우면, 그 시작용 snr() 도
       "다 모았다" 갈래로 빠져 stc()(엔딩)가 두 번 돌았다.
         ① gp==='playing' 이 되기 전에는 버튼이 안 눌린다 (흐리게 표시 + pointer-events 끌)
         ② stc() 를 감싸 **페이지당 한 번만** 통과시킨다
       ※ 새 게임은 항상 페이지를 새로 읽는다(gcBack · PLAY AGAIN 둘 다 location.reload)
         → "페이지당 한 번" 으로 충분하다.

     [라이브와의 관계]
       ⚠️ 버튼은 **이 파일 안에만** 있다. script.js · index.html · style.css 는 한 글자도 안 건드렸다.
          (게임 코드는 라이브 것을 그대로 불러 쓴다 — 진짜 라이브와 같은 코드를 시험하는 셈)
       ⚠️ 이 파일은 라이브로 **이식하지 않는다.** 확인용이라 역할이 끝나면 그냥 둔다.
-->

<!-- ★ 부팅 가드 — script.js 가 도착하기 전에 눌린 버튼을 기억했다가, 도착 즉시 자동 실행한다.
     [문제] 시작화면 버튼은 HTML 만으로 즉시 보이고 눌린다. 그런데 그 버튼을 처리하는 함수
       (goModeSelect 등 11개)는 body 맨 끝의 script.js 가 다 받아진 뒤에야 생긴다.
       느린 네트워크에서 그 틈에 아이가 누르면 "Uncaught ReferenceError: goModeSelect is not defined"
       가 나고, script.js 의 window.onerror 가 이를 삼켜서 화면은 그냥 무반응이 됐다.
       (2026-08-05 GA4 game_error 실측: error_where=init 12건, 멕시코·필리핀·네팔에 집중)
     [원리] 진짜 함수가 오기 전까지 같은 이름의 '대기표' 함수를 미리 만들어 둔다.
       대기표가 불리면 무엇을 눌렀는지 기억만 해 두고, script.js 가 실행되면서 진짜 함수가
       대기표를 덮어쓴다(script.js 의 함수는 전부 function 선언이라 자동으로 덮어씀).
       그 직후 body 끝의 __bootFlush() 가 기억해 둔 것을 한 번 실행한다.
     [안전] 진짜 함수가 끝내 안 오면(로드 실패) 아무것도 실행하지 않는다 — 지금과 같은 상태로 남을 뿐,
       더 나빠지지 않는다. 전체가 try-catch 라 가드가 고장나도 게임은 그대로 돈다. -->
<script>
(function () {
  'use strict';
  try {
    var NAMES = ['goModeSelect','goWordCat','goWordPuzzle','goAnimalPuzzle','goDinoPuzzle',
                 'goMode','wcBack','wcLocked','msBack','wpBack','gcBack','goPhonics'];
    var stubs = {}, pending = null, dotsEl = null, ready = false;

    // 기다리는 중 표시(개구리 인사말 아래 점점점). style.css 가 아직 안 왔어도 보이게 인라인 스타일만 사용.
    function showDots() {
      try {
        if (dotsEl || ready) return;
        var host = document.querySelector('.ss .sub') || document.querySelector('.ss');
        if (!host) return;
        var st = document.createElement('style');
        st.textContent = '@keyframes bootBlink{0%,100%{opacity:.25}50%{opacity:.95}}';
        (document.head || document.documentElement).appendChild(st);
        dotsEl = document.createElement('div');
        dotsEl.id = 'bootWait';
        dotsEl.textContent = '• • •';
        dotsEl.style.cssText = 'font:700 22px/1 system-ui,sans-serif;color:#fff;text-align:center;' +
          'margin-top:8px;letter-spacing:3px;animation:bootBlink 1s infinite;' +
          'text-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none';
        if (host.parentNode) host.parentNode.insertBefore(dotsEl, host.nextSibling);
      } catch (e) {}
    }
    function hideDots() {
      try { if (dotsEl && dotsEl.parentNode) dotsEl.parentNode.removeChild(dotsEl); } catch (e) {}
      dotsEl = null;
    }

    // 대기표 함수 등록 — 마지막에 누른 것 하나만 기억(연타해도 한 번만 실행)
    for (var i = 0; i < NAMES.length; i++) {
      (function (n) {
        if (typeof window[n] === 'function') return;   // 이미 진짜가 있으면 절대 건드리지 않음
        stubs[n] = function () { pending = { n: n, a: [].slice.call(arguments) }; showDots(); };
        window[n] = stubs[n];
      })(NAMES[i]);
    }

    // 눌렀다는 느낌은 줘야 하므로 살짝 눌린 표시(로딩 중일 때만)
    document.addEventListener('click', function (ev) {
      try {
        if (ready) return;
        var t = ev && ev.target;
        var b = (t && t.closest) ? t.closest('.game-card,.gbk,.mbtn') : null;
        if (!b) return;
        b.style.transform = 'scale(.94)'; b.style.opacity = '.75';
        setTimeout(function () { try { b.style.transform = ''; b.style.opacity = ''; } catch (e) {} }, 200);
      } catch (e) {}
    }, true);

    // script.js(+frog-reactions.js) 실행 직후 호출 — 기억해 둔 버튼을 실행한다.
    // document.write 로 넣은 스크립트는 파서를 멈추고 동기 실행되므로, 이 함수가 불릴 시점엔 이미 로드가 끝나 있다.
    window.__bootFlush = function () {
      try {
        ready = true;
        hideDots();
        if (!pending) return;
        var p = pending; pending = null;
        var f = window[p.n];
        if (typeof f === 'function' && f !== stubs[p.n]) f.apply(null, p.a);   // 대기표가 아직 그대로면 실행 안 함
      } catch (e) {}
    };
    window.__bootState = function () { return { ready: ready, pending: pending && pending.n }; };  // 테스트 확인용
  } catch (e) {}
})();
</script>

     로딩 중에 눌러 둔 버튼이 있으면 지금 한 번 실행한다(없으면 아무 일도 안 함). -->
<script>try{ if(window.__bootFlush) window.__bootFlush(); }catch(e){}</script>
<script>
// 캐시 도우미(서비스워커) 사용 안 함 — 앱은 항상 서버 최신을 직접 로드(푸시 즉시 반영).

try {
  if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(reg){ try { reg.unregister(); } catch (e) {} });
    }).catch(function(){});
  }
  if (window.caches && caches.keys) {
    caches.keys().then(function(keys){
      keys.forEach(function(k){ try { caches.delete(k); } catch (e) {} });
    }).catch(function(){});
  }
} catch (e) {}
</script>

<!-- ★★★ [TEST 전용] 26글자 채우기 버튼 — 라이브엔 없다 ★★★ -->
<style>
#t26{position:fixed;left:10px;top:150px;z-index:99999;
  padding:9px 13px;border:none;border-radius:10px;cursor:pointer;
  font:700 14px/1.2 'Segoe UI',sans-serif;color:#fff;
  background:#D500F9;box-shadow:0 3px 10px rgba(0,0,0,.35);
  opacity:.3;pointer-events:none;transition:opacity .3s}
#t26.on{opacity:1;pointer-events:auto}
#t26:active{transform:scale(.93)}
#t26note{position:fixed;left:10px;top:190px;z-index:99999;pointer-events:none;
  background:rgba(0,0,0,.72);color:#fff;font:600 11px/1.45 'Segoe UI',sans-serif;
  padding:5px 9px;border-radius:7px;max-width:62vw;transition:opacity .5s}
</style>
<button id="t26" type="button">🏁 26글자 채우기</button>
<div id="t26note">TEST 전용 버튼<br><span style="opacity:.8">게임이 시작되면 켜집니다</span></div>
<script>
(function(){
  var btn  = document.getElementById('t26');
  var note = document.getElementById('t26note');
  var fired = false;                 // 엔딩이 이미 돌았는가

  function say(html){ try{ if(note) note.innerHTML = html; }catch(e){} }

  // ───── 막음 ② : stc()(엔딩)를 페이지당 한 번만 통과시킨다 ─────
  // 게임 시작 절차의 snr() 과 버튼이 같은 순간에 걹쳐도 엔딩은 한 번만 돌게 한다.
  // script.js 의 stc 는 전역 함수라 window.stc 를 바꾸면 pnt() 가 부를 때도 이게 불린다.
  try{
    if (typeof stc === 'function' && !stc.__t26){
      var _stc = stc;
      window.stc = function(){
        if (fired) return;           // 두 번째 호출은 버린다
        fired = true;
        try{ btn.classList.remove('on'); }catch(e){}
        say('엔딩 시작 🎉<br><span style="opacity:.8">3.5초 WELL DONE · 7초 왕관 · 9초 HOORAY</span>');
        // 엔딩을 가리지 않게 버튼·안내를 치운다
        setTimeout(function(){
          try{ btn.style.display='none'; note.style.opacity='0'; }catch(e){}
        }, 1800);
        return _stc.apply(this, arguments);
      };
      window.stc.__t26 = 1;
    }
  }catch(e){}

  // ───── 막음 ① : 게임이 완전히 시작된 뒤에만 눌린다 ─────
  // gp 는 script.js 의 게임 상태다. 'playing' 이 되는 순간이 곳 시작 절차가 끝난 지점이다.
  //   · abc · ABc : go() 의 500ms 타이머 안에서 'playing'
  //   · ABC        : tut() 이 끝나는 약 6.8초 뒤에 'playing'
  function ready(){
    try{
      if (typeof gp === 'undefined' || gp !== 'playing') return false;
      if (typeof col === 'undefined' || typeof L === 'undefined') return false;
      if (typeof snr !== 'function') return false;
      return true;
    }catch(e){ return false; }
  }
  setInterval(function(){
    if (fired) return;
    try{
      if (ready()){
        if (!btn.classList.contains('on')){
          btn.classList.add('on');
          say('누를 수 있습니다<br><span style="opacity:.8">누르면 바로 엔딩이 시작됩니다</span>');
        }
      } else {
        btn.classList.remove('on');
      }
    }catch(e){}
  }, 300);

  // ───── 버튼 ─────
  btn.addEventListener('click', function(){
    if (fired) return;
    if (!ready()){
      say('아직 누를 수 없습니다<br><span style="opacity:.8">게임이 완전히 시작된 뒤에 켜집니다</span>');
      return;
    }
    try{
      // 26글자를 모은 상태로 만든다 (수집판·개구리 단계까지 실제와 같게)
      var all = L.split('');
      for (var i=0; i<all.length; i++){
        col.add(all[i]);
        var slot = document.getElementById('s' + all[i]);
        if (slot) slot.classList.add('got');
      }
      try{ updateFrogStage(); }catch(e){}
      ct = all[all.length-1];   // 마지막 글자를 방금 잡은 상태
      snr();                    // → pnt() 가 null 을 돌려주면서 stc()(엔딩) 시작
    }catch(e){
      say('실패: ' + (e && e.message ? e.message : e));
    }
  });
})();
</script>

<!-- ★★★ [TEST 전용] "지금 상태 보기" — 왕관 위치를 재서 보여주기만 한다 ★★★
     ⚠️ 왕관 위치는 한 픽셀도 안 건드린다. 읽기(측정)만 하는 코드다.
     ⚠️ position:fixed 라 게임 배치에 영향이 없고, 개구리·왕관은 화면 아래쪽이라 안 가린다.
-->
<style>
#tdiag{position:fixed;left:0;right:0;top:0;z-index:99998;pointer-events:none;
  background:rgba(0,0,0,.80);color:#fff;
  font:600 13px/1.5 'Segoe UI',system-ui,sans-serif;
  padding:7px 8px 8px 90px;                 /* 왼쪽 90px = 뒤로 화살표 자리 비움 */
  -webkit-text-size-adjust:none; text-size-adjust:none;}
#tdiag b{color:#FFD54F}
#tdiag .ok{color:#69F0AE}
#tdiag .bad{color:#FF8A80}
#tdiag .snap{display:block;margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,.28);color:#FFEB3B}
</style>
<div id="tdiag">준비 중…</div>
<script>
(function(){
  var box = document.getElementById('tdiag');
  var snapHtml = '';                      // 왕관 뜬 순간에 고정해 둘 줄
  var snapDone = false;

  // ── 폰 글자배율 재기 ──
  // 앱(WebView)의 setTextZoom 이나 폰 글꼴 설정은 '화면에 그려지는 글자'만 키운다.
  // canvas 의 measureText 는 그 배율을 안 받으므로, 둘의 폭을 비교하면 배율이 나온다.
  function textZoom(){
    try{
      var p = document.createElement('span');
      p.style.cssText = 'position:absolute;left:-9999px;top:0;font-size:16px;white-space:nowrap;font-family:sans-serif';
      p.textContent = 'MMMMMMMMMMMMMMMM';
      document.body.appendChild(p);
      var domW = p.getBoundingClientRect().width;
      p.remove();
      var c = document.createElement('canvas').getContext('2d');
      c.font = '16px sans-serif';
      var cvW = c.measureText('MMMMMMMMMMMMMMMM').width;
      if (!(cvW > 0)) return null;
      return domW / cvW;
    }catch(e){ return null; }
  }

  // ── 어디서 실행 중인가 ──
  function where(){
    try{
      if (window.AndroidBridge) return '본게임 앱';
      var ua = navigator.userAgent || '';
      if (/; wv\)/.test(ua)) return '앱(WebView)';
      return '폰 크롬';
    }catch(e){ return '?'; }
  }

  function read(){
    var out = { err:null };
    try{
      var frogEl = document.getElementById('frog');
      var crown  = document.getElementById('crown');
      var img    = frogEl ? frogEl.querySelector('.frog-img.active') : null;
      out.stage   = (typeof frogStage !== 'undefined') ? frogStage : '?';
      out.imgId   = img ? img.id : '(없음)';
      out.vw = Math.round(innerWidth); out.vh = Math.round(innerHeight);
      out.dpr = (window.devicePixelRatio || 1).toFixed(2);
      out.zoom = textZoom();
      out.where = where();
      try{ out.fredoka = (document.fonts && document.fonts.check) ? document.fonts.check('16px Fredoka') : null; }
      catch(e){ out.fredoka = null; }

      if (!crown){ out.noCrown = true; return out; }

      var fr = frogEl.getBoundingClientRect();
      var cr = crown.getBoundingClientRect();
      var cs = getComputedStyle(crown);

      // 왕관 이모지의 '실제 그려지는' 세로 범위
      var m = document.createElement('canvas').getContext('2d');
      m.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      var M = m.measureText('👑');
      var contentH = M.fontBoundingBoxAscent + M.fontBoundingBoxDescent;
      var halfLead = (cr.height - contentH) / 2;
      var baseY    = cr.top + halfLead + M.fontBoundingBoxAscent;
      out.inkTop    = baseY - M.actualBoundingBoxAscent;
      out.inkBottom = baseY + M.actualBoundingBoxDescent;
      out.inkH      = M.actualBoundingBoxAscent + M.actualBoundingBoxDescent;
      out.lineH     = cr.height;
      out.padTop    = out.inkTop - cr.top;
      out.padBot    = cr.bottom - out.inkBottom;
      out.fontPx    = parseFloat(cs.fontSize);

      // 개구리 그림의 '진짜 머리 꼭대기' (투명하지 않은 첫 줄)
      if (img && img.naturalWidth){
        var S = 256, cv = document.createElement('canvas');
        cv.width = S; cv.height = S;
        var cx = cv.getContext('2d');
        cx.drawImage(img, 0, 0, S, S);
        var d = cx.getImageData(0, 0, S, S).data, t = -1;
        for (var y = 0; y < S && t < 0; y++)
          for (var x = 0; x < S; x++) if (d[(y*S+x)*4+3] > 20){ t = y; break; }
        out.headPct = t / S;
        out.headY   = fr.top + fr.height * out.headPct;
        out.gap     = out.headY - out.inkBottom;      // 양수 = 떠 있음
        out.gapPct  = out.gap / fr.height * 100;
      }
      out.frogH = fr.height;
    }catch(e){ out.err = (e && e.message) ? e.message : String(e); }
    return out;
  }

  function line(o){
    if (o.err) return '<span class="bad">측정 실패: ' + o.err + '</span>';
    var z = (o.zoom == null) ? '?' : Math.round(o.zoom * 100) + '%';
    var head = '<b>단계 ' + o.stage + '</b> · ' + o.imgId +
               ' · 글자배율 <b>' + z + '</b> · ' + o.vw + '×' + o.vh + ' (dpr ' + o.dpr + ')' +
               ' · ' + o.where;
    var f = (o.fredoka === null) ? 'Fredoka ?' : (o.fredoka ? 'Fredoka 로드됨' : '<span class="bad">Fredoka 실패</span>');
    if (o.noCrown) return head + '<br>왕관 아직 없음 — 엔딩 7초 시점에 값이 나옵니다<br>' + f;
    var verdict = (o.gap == null) ? '<span class="bad">머리 측정 불가</span>'
                : (o.gap > 0 ? '<span class="bad">⚠️ 떠 있음</span>' : '<span class="ok">✅ 얹힘</span>');
    var g = (o.gap == null) ? '?' : (o.gap > 0 ? '+' : '') + o.gap.toFixed(1) + 'px (' + o.gapPct.toFixed(1) + '%)';
    var l2 = '왕관아래 ' + o.inkBottom.toFixed(0) + ' / 머리꼭대기 ' +
             (o.headY == null ? '?' : o.headY.toFixed(0)) + ' → 틈 <b>' + g + '</b>  ' + verdict;
    var l3 = '왕관글자 ' + o.fontPx.toFixed(1) + 'px · 잉크 ' + o.inkH.toFixed(0) +
             'px · 줄상자 ' + o.lineH.toFixed(0) + 'px(빈공간 위' + o.padTop.toFixed(0) +
             '/아래' + o.padBot.toFixed(0) + ') · ' + f;
    var l4 = '머리 ' + (o.headPct == null ? '?' : (o.headPct*100).toFixed(1) + '%') +
             ' · 개구리칸 ' + o.frogH.toFixed(0) + 'px';
    return head + '<br>' + l2 + '<br>' + l3 + '<br>' + l4;
  }

  var crownSeen = false;
  setInterval(function(){
    try{
      var o = read();
      var html = line(o);

      // 왕관이 처음 뜨면 1.6초 뒤(등장 애니메이션이 끝난 뒤) 값을 '고정'해 둔다.
      // 숨쉬기가 왕관을 1%↔1.5% 로 흔들어 실시간 값이 ±1px 움직이기 때문.
      if (!crownSeen && document.getElementById('crown')){
        crownSeen = true;
        setTimeout(function(){
          if (snapDone) return;
          snapDone = true;
          var s2 = read();
          snapHtml = '<span class="snap">★ 왕관 뜬 순간 고정값 — ' +
                     ((s2.gap == null) ? '?' :
                       ((s2.gap > 0 ? '+' : '') + s2.gap.toFixed(1) + 'px  ' +
                        (s2.gap > 0 ? '⚠️ 떠 있음' : '✅ 얹힘'))) +
                     ' (단계 ' + s2.stage + ' · ' + s2.imgId +
                     ' · 배율 ' + (s2.zoom == null ? '?' : Math.round(s2.zoom*100) + '%') + ')</span>';
        }, 1600);
      }
      box.innerHTML = html + snapHtml;
    }catch(e){
      try{ box.textContent = '표시 오류: ' + e.message; }catch(_){}
    }
  }, 400);
})();
</script>
</body>
