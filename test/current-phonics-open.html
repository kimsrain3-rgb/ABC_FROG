     GA4·에러추적은 뺐음(테스트 플레이가 실유저 통계에 안 섞이게).
     바탕: current-phonicsbtn.html(2026-08-05 라이브 반영분) + Phonics 카드 잠금해제 + 파닉스 오버레이. -->

<!-- 캐시 무력화: 매 실행마다 다른 주소로 불러 항상 최신 CSS 받기(버전번호 수동관리 불필요) -->
<script>document.write('<link rel="stylesheet" href="style.css?b=' + Date.now() + '">');</script>
<!-- 테스트 빌드라 GA4·에러추적 없음 -->
<script>window.gtag=window.gtag||function(){};</script>

<!-- ★ 부팅 가드 — script.js 가 도착하기 전에 눌린 버튼을 기억했다가, 도착 즉시 자동 실행한다.
     [문제] 시작화면 버튼은 HTML 만으로 즉시 보이고 눌린다. 그런데 그 버튼을 처리하는 함수
       (goModeSelect 등 11개)는 body 맨 끝의 script.js 가 다 받아진 뒤에야 생긴다.
       느린 네트워크에서 그 틈에 아이가 누르면 "Uncaught ReferenceError: goModeSelect is not defined"
       가 나고, script.js 의 window.onerror 가 이를 삼켜서 화면은 그냥 무반응이 됐다.
       (2026-08-05 GA4 game_error 실측: error_where=init 12건, 멕시코·필리핀·네팔에 집중)
     [원리] 진짜 함수가 오기 전까지 같은 이름의 '대기표' 함수를 미리 만들어 둔다.
       대기표가 불리면 무엇을 눌렀는지 기억만 해 두고, script.js 가 실행되면서 진짜 함수가
       대기표를 덮어쓴다(script.js 의 함수는 전부 function 선언이라 자동으로 덮어씀).
       그 직후 body 끝의 __bootFlush() 가 기억해 둔 것을 한 번 실행한다.
     [안전] 진짜 함수가 끝내 안 오면(로드 실패) 아무것도 실행하지 않는다 — 지금과 같은 상태로 남을 뿐,
       더 나빠지지 않는다. 전체가 try-catch 라 가드가 고장나도 게임은 그대로 돈다. -->
<script>
(function () {
  'use strict';
  try {
    var NAMES = ['goModeSelect','goWordCat','goWordPuzzle','goAnimalPuzzle','goDinoPuzzle',
                 'goMode','wcBack','wcLocked','msBack','wpBack','gcBack',
                 'goPhonics'];   // ← 테스트 추가분. 진짜 goPhonics 는 body 끝(script.js 뒤)에서 정의됨
    var stubs = {}, pending = null, dotsEl = null, ready = false;

    // 기다리는 중 표시(개구리 인사말 아래 점점점). style.css 가 아직 안 왔어도 보이게 인라인 스타일만 사용.
    function showDots() {
      try {
        if (dotsEl || ready) return;
        var host = document.querySelector('.ss .sub') || document.querySelector('.ss');
        if (!host) return;
        var st = document.createElement('style');
        st.textContent = '@keyframes bootBlink{0%,100%{opacity:.25}50%{opacity:.95}}';
        (document.head || document.documentElement).appendChild(st);
        dotsEl = document.createElement('div');
        dotsEl.id = 'bootWait';
        dotsEl.textContent = '• • •';
        dotsEl.style.cssText = 'font:700 22px/1 system-ui,sans-serif;color:#fff;text-align:center;' +
          'margin-top:8px;letter-spacing:3px;animation:bootBlink 1s infinite;' +
          'text-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none';
        if (host.parentNode) host.parentNode.insertBefore(dotsEl, host.nextSibling);
      } catch (e) {}
    }
    function hideDots() {
      try { if (dotsEl && dotsEl.parentNode) dotsEl.parentNode.removeChild(dotsEl); } catch (e) {}
      dotsEl = null;
    }

    // 대기표 함수 등록 — 마지막에 누른 것 하나만 기억(연타해도 한 번만 실행)
    for (var i = 0; i < NAMES.length; i++) {
      (function (n) {
        if (typeof window[n] === 'function') return;   // 이미 진짜가 있으면 절대 건드리지 않음
        stubs[n] = function () { pending = { n: n, a: [].slice.call(arguments) }; showDots(); };
        window[n] = stubs[n];
      })(NAMES[i]);
    }

    // 눌렀다는 느낌은 줘야 하므로 살짝 눌린 표시(로딩 중일 때만)
    document.addEventListener('click', function (ev) {
      try {
        if (ready) return;
        var t = ev && ev.target;
        var b = (t && t.closest) ? t.closest('.game-card,.gbk,.mbtn') : null;
        if (!b) return;
        b.style.transform = 'scale(.94)'; b.style.opacity = '.75';
        setTimeout(function () { try { b.style.transform = ''; b.style.opacity = ''; } catch (e) {} }, 200);
      } catch (e) {}
    }, true);

    // script.js(+frog-reactions.js) 실행 직후 호출 — 기억해 둔 버튼을 실행한다.
    // document.write 로 넣은 스크립트는 파서를 멈추고 동기 실행되므로, 이 함수가 불릴 시점엔 이미 로드가 끝나 있다.
    window.__bootFlush = function () {
      try {
        ready = true;
        hideDots();
        if (!pending) return;
        var p = pending; pending = null;
        var f = window[p.n];
        if (typeof f === 'function' && f !== stubs[p.n]) f.apply(null, p.a);   // 대기표가 아직 그대로면 실행 안 함
      } catch (e) {}
    };
    window.__bootState = function () { return { ready: ready, pending: pending && pending.n }; };  // 테스트 확인용
  } catch (e) {}
})();
</script>
<style>
/* ── 시작화면 카드 = Word 메뉴(.wc-card)와 같은 가로로 긴 알약, 위아래로 쌓기 ── */

/* ── 퍼즐 메뉴(.wc): 짧은 화면에서 마지막 Insect 가 바닥에 붙거나 잘리던 것 → 아래 여백 확보 ──
   .wc 는 내용을 한가운데 정렬해서 위아래 여백이 항상 같다. 내용이 713px 라 화면이 짧으면 양쪽이 같이 좁아진다
   (360×740에서 위아래 13px, 360×640에선 Insect 가 37px 잘림). 짧은 화면에서만 조금씩 줄여 여유를 만든다. */

<!-- ★★ 파닉스(satpin) 열기 — 테스트 전용. 동물·공룡 퍼즐과 완전히 같은 구조(전체화면 iframe 오버레이).
     기존 게임 코드와 분리돼 있어 충돌 위험이 없고, 라이브 script.js 는 한 글자도 안 고친다.
     ※ 라이브로 옮길 때는 아래 두 개의 '우회'를 script.js·frog-reactions.js 에 정식으로 넣어야 한다:
        ① script.js  inPlayScreen() 에 파닉스 오버레이 검사 추가 (지금은 여기서 감싸서 대신함)
        ② frog-reactions.js otherScreenOpen() 의 iframe 검사에 파닉스 추가 + 함수 감싸기 목록에 goPhonics -->
<script>
(function(){
  'use strict';
  var _phOverlay = null;

  window.goPhonics = function(){
    try{
      if(_phOverlay) return;                      // 중복 열기 방지
      // 개구리 인사/반응이 돌고 있으면 정리 (파닉스 위로 소리가 겹치지 않게).
      // frog-reactions.js 는 goPhonics 를 모르므로 여기서 직접 세워준다.
      try{ if(window.__frogreact && window.__frogreact.stop) window.__frogreact.stop(); }catch(e){}

      var ov = document.createElement('div');
      ov.id = 'phOverlay';
      ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#000;';

      var fr = document.createElement('iframe');
      fr.setAttribute('allow','autoplay; fullscreen');
      fr.style.cssText = 'border:0;width:100%;height:100%;display:block;';
      // base href 가 '../' 라 상대주소는 저장소 뿌리 기준이 된다 → test/ 를 반드시 붙일 것
      fr.src = 'test/phonics/index.html?b=' + Date.now();

      var bk = document.createElement('button');
      bk.setAttribute('aria-label','back');
      bk.onclick = window.closePhonics;
      bk.className = 'gbk gbk-dim';               // 모양은 공용 클래스(동물·공룡 퍼즐과 동일)
      bk.style.cssText = 'position:fixed;top:14px;left:14px;z-index:100000';

      ov.appendChild(fr); ov.appendChild(bk);
      document.body.appendChild(ov);
      _phOverlay = ov;

      try{ if(window.syncBackGuard) window.syncBackGuard(); }catch(e){}   // 물리 뒤로가기 보호 켜기
      try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(function(){}); }catch(e){}
    }catch(e){}
  };

  window.closePhonics = function(){
    try{ if(_phOverlay && _phOverlay.parentNode) _phOverlay.parentNode.removeChild(_phOverlay); }catch(e){}
    _phOverlay = null;
    try{ if(window.syncBackGuard) window.syncBackGuard(); }catch(e){}
  };

  // 물리 뒤로가기 우회 — script.js 의 inPlayScreen() 은 파닉스를 모른다.
  // 그대로 두면 "시작화면에 있다"고 판단해 보호칸을 반납 → 뒤로가기 한 번에 앱이 꺼진다.
  try{
    var origInPlay = window.inPlayScreen;
    if(typeof origInPlay === 'function'){
      window.inPlayScreen = function(){
        if(_phOverlay) return true;                       // 파닉스 중 = 게임 중
        return origInPlay.apply(this, arguments);
      };
    }
  }catch(e){}

  // 물리 뒤로가기로 파닉스 닫기.
  // script.js 의 popstate 는 파닉스를 모르는 채 "시작화면(.ss)이 보이네" 로 판단하고 그냥 돌아간다
  // (여분 칸도 다시 안 만든다) → 그대로 두면 뒤로가기 두 번에 파닉스가 열린 채 앱이 꺼진다.
  // script.js 리스너가 먼저 등록돼 먼저 돌고, 그 다음 이게 돌아 파닉스를 닫는다.
  window.addEventListener('popstate', function(){
    try{ if(_phOverlay) window.closePhonics(); }catch(e){}
  });

  window.__phState = function(){ return { open: !!_phOverlay }; };   // 검증 확인용
})();
</script>

<!-- ★ 부팅 가드 마무리 — 위 두 스크립트가 동기 로드라 여기 오면 진짜 함수가 이미 준비됐다.
     로딩 중에 눌러 둔 버튼이 있으면 지금 한 번 실행한다(없으면 아무 일도 안 함). -->
<script>try{ if(window.__bootFlush) window.__bootFlush(); }catch(e){}</script>
<script>
// 캐시 도우미(서비스워커) 사용 안 함 — 앱은 항상 서버 최신을 직접 로드(푸시 즉시 반영).
// 과거에 등록된 서비스워커/캐시가 있으면 깨끗이 정리(자가 복구). 새로 등록은 하지 않음.
try {
  if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(reg){ try { reg.unregister(); } catch (e) {} });
    }).catch(function(){});
  }
  if (window.caches && caches.keys) {
    caches.keys().then(function(keys){
      keys.forEach(function(k){ try { caches.delete(k); } catch (e) {} });
    }).catch(function(){});
  }
} catch (e) {}
</script>
